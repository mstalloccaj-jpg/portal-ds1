<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal DS-1 — Informes Técnicos de Inspección</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* =====================================================
   PORTAL DS-1 — Versión producción v1.0
   Para personalizar: busca los comentarios [CONFIG]
   ===================================================== */

:root {
  --bg: #ffffff;
  --bg2: #f7f8fa;
  --bg3: #eef0f3;
  --border: #e3e5ea;
  --border2: #c9cdd6;
  --text: #111827;
  --text2: #6b7280;
  --text3: #9ca3af;
  --blue: #1d4ed8;
  --blue-bg: #eff6ff;
  --blue-text: #1e40af;
  --green: #15803d;
  --green-bg: #f0fdf4;
  --green-text: #166534;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --red-text: #991b1b;
  --amber: #d97706;
  --amber-bg: #fffbeb;
  --amber-text: #92400e;
  --radius: 8px;
  --radius-sm: 5px;
  --shadow: 0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --sidebar-w: 210px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #252836;
    --border: #2a2d3a;
    --border2: #3a3d4a;
    --text: #e8eaf0;
    --text2: #9299ae;
    --text3: #5a6278;
    --blue: #3b82f6;
    --blue-bg: #1e2d4a;
    --blue-text: #93c5fd;
    --green: #22c55e;
    --green-bg: #0f2a1a;
    --green-text: #86efac;
    --red: #ef4444;
    --red-bg: #2a0f0f;
    --red-text: #fca5a5;
    --amber: #f59e0b;
    --amber-bg: #2a1f0a;
    --amber-text: #fcd34d;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg2);-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}

/* Layout */
.portal-layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* Sidebar */
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sb-brand-logo{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.sb-brand-icon{width:30px;height:30px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.sb-brand-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.2}
.sb-brand-tagline{font-size:10px;color:var(--text3);letter-spacing:.3px}
.sb-user{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.sb-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;background:var(--blue-bg);color:var(--blue-text)}
.sb-uname{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.sb-ucmp{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.sb-nav{flex:1;padding:10px 0;overflow-y:auto}
.sb-section-label{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;padding:10px 16px 4px}
.sb-link{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border-left:3px solid transparent;transition:all .12s;user-select:none}
.sb-link:hover{background:var(--bg2);color:var(--text);border-left-color:var(--border2)}
.sb-link.active{background:var(--bg2);color:var(--blue);border-left-color:var(--blue);font-weight:600}
.sb-link i{font-size:17px;flex-shrink:0}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border)}
.sb-badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:100px;font-size:10px;font-weight:600;margin-left:auto}
.sb-badge-admin{background:var(--blue-bg);color:var(--blue-text)}
.sb-badge-client{background:var(--bg3);color:var(--text2)}

/* Main header */
.main-header{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg);min-height:58px;flex-shrink:0}
.main-header-title{font-size:15px;font-weight:600;color:var(--text)}
.main-header-sub{font-size:11px;color:var(--text3);margin-top:1px}
.main-content{flex:1;overflow-y:auto;padding:22px;background:var(--bg2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;font-size:12px;font-weight:500;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text);transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:var(--border2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{opacity:.9}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-success:hover{opacity:.9}
.btn-danger{background:var(--red-bg);color:var(--red-text);border-color:var(--red)}
.btn-danger:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:2px 8px;font-size:10px}
.btn-icon{padding:6px;border-radius:var(--radius-sm)}

/* Inputs */
.inp{width:100%;padding:7px 10px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);transition:border .12s}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.inp::placeholder{color:var(--text3)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.5}
.lbl{display:block;font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.form-group{margin-bottom:12px}
.form-row{display:grid;gap:10px}
.form-row-2{grid-template-columns:1fr 1fr}
.form-row-3{grid-template-columns:repeat(3,1fr)}
.form-row-4{grid-template-columns:repeat(4,1fr)}

/* Cards */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card-sm{padding:12px 14px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:5px}
.stat-icon{font-size:22px;margin-bottom:6px;display:block}

/* Table */
.tbl-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl thead{background:var(--bg2)}
.tbl th{padding:10px 14px;text-align:left;font-size:10px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--bg2)}
.tbl-search{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.tbl-search input{max-width:280px}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:600;letter-spacing:.2px}
.badge-pass{background:var(--green-bg);color:var(--green-text)}
.badge-fail{background:var(--red-bg);color:var(--red-text)}
.badge-cond{background:var(--amber-bg);color:var(--amber-text)}
.badge-admin{background:var(--blue-bg);color:var(--blue-text)}
.badge-client{background:var(--bg3);color:var(--text2)}
.badge-cat{background:var(--bg3);color:var(--text2);font-size:9px}

/* Alert / messages */
.alert{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px}
.alert-err{background:var(--red-bg);color:var(--red-text);border:1px solid var(--red)}
.alert-ok{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green)}
.alert i{font-size:16px;flex-shrink:0;margin-top:1px}

/* Login */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);padding:20px}
.login-card{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-header{text-align:center;margin-bottom:28px}
.login-icon{width:52px;height:52px;background:var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-size:26px}
.login-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2)}
.demo-creds{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:18px;font-size:11px;color:var(--text2);line-height:1.8}
.demo-creds strong{color:var(--text);font-weight:600}

/* Report detail */
.report-doc{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.report-doc-header{padding:18px 20px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.report-doc-title{font-size:16px;font-weight:700;color:var(--text)}
.report-doc-sub{font-size:11px;color:var(--text3);margin-top:2px}
.report-section{border-bottom:1px solid var(--border)}
.report-section:last-child{border-bottom:none}
.rs-header{padding:9px 18px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:6px}
.rs-body{padding:14px 18px}
.rs-grid{display:grid;gap:10px}
.rs-grid-2{grid-template-columns:repeat(2,1fr)}
.rs-grid-3{grid-template-columns:repeat(3,1fr)}
.rs-field label{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:2px}
.rs-field span{font-size:13px;color:var(--text);font-weight:500}
.rs-result{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.rs-result-verdict{font-size:22px;font-weight:700}
.rs-result-ok{color:var(--green)}
.rs-result-fail{color:var(--red)}
.rs-result-cond{color:var(--amber)}
.rs-result-desc{font-size:12px;color:var(--text2);margin-top:3px}

/* Measurement cells */
.cell-pass{background:rgba(21,128,61,.1);color:#166534;font-weight:600;border-radius:3px;padding:1px 4px;font-size:11px;font-family:monospace}
.cell-fail{background:rgba(220,38,38,.1);color:#991b1b;font-weight:600;border-radius:3px;padding:1px 4px;font-size:11px;font-family:monospace}
.cell-na{color:var(--text3);font-size:11px}

/* Upload area */
.upload-drop{border:2px dashed var(--border2);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:14px;background:var(--bg2)}
.upload-drop:hover{border-color:var(--blue);background:var(--blue-bg)}
.upload-drop i{font-size:28px;color:var(--text3);display:block;margin-bottom:8px}
.upload-drop p{font-size:12px;color:var(--text2)}

/* Empty state */
.empty-state{text-align:center;padding:50px 20px;color:var(--text3)}
.empty-state i{font-size:36px;display:block;margin-bottom:12px}
.empty-state p{font-size:13px}
.empty-state .empty-hint{font-size:11px;margin-top:6px;color:var(--text3)}

/* Divider */
.divider{height:1px;background:var(--border);margin:16px 0}
.divider-label{text-align:center;position:relative;margin:16px 0}
.divider-label::before{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border)}
.divider-label span{position:relative;background:var(--bg);padding:0 12px;font-size:11px;color:var(--text3)}

/* Actions bar */
.actions-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.actions-bar-left{flex:1}

/* Print */
@media print {
  .sidebar,.main-header,.no-print,.actions-bar,.tbl-search{display:none!important}
  .portal-layout,.main-area{display:block;height:auto;overflow:visible}
  .main-content{padding:0;overflow:visible}
  .report-doc{box-shadow:none;border:1px solid #ccc}
  body{background:#fff;color:#000}
  .badge-pass::before{content:"APROBADO"}
  .badge-fail::before{content:"RECHAZADO"}
  @page{margin:1.5cm}
}

/* Responsive sidebar collapse */
@media (max-width:768px) {
  :root{--sidebar-w:0px}
  .sidebar{position:absolute;z-index:100;left:-210px;transition:left .25s;width:210px}
  .sidebar.open{left:0;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .hamburger{display:flex}
  .main-content{padding:12px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .tbl-wrap{overflow:hidden}
  .tbl thead{display:none}
  .tbl tbody tr{display:block;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;padding:12px;background:var(--bg)}
  .tbl tbody tr:hover td{background:transparent}
  .tbl td{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border:none;font-size:13px}
  .tbl td::before{content:attr(data-label);font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;margin-right:8px}
  .tbl td:last-child{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);justify-content:flex-end}
  .tbl-search{flex-wrap:wrap}
  .tbl-search input{max-width:100%}
  .actions-bar{flex-wrap:wrap}
  .form-row-2,.form-row-3,.form-row-4{grid-template-columns:1fr}
  .rs-grid-2,.rs-grid-3{grid-template-columns:1fr}
}
.hamburger{display:none;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:var(--bg);color:var(--text2)}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =========================================================
   PORTAL DS-1 — Informes Técnicos de Inspección
   DS-1® Vol 3 y Addendum
   =========================================================

   [CONFIG] Personalización inicial:
   - Cambiar COMPANY_NAME por el nombre de tu empresa
   - Modificar DEMO_USERS para crear las cuentas reales
   - Cambiar el favicon y el título en el <head>

   Para producción con backend real:
   - Reemplazar las funciones sGet/sSet/sDel
     por llamadas a tu API REST (fetch / axios)
   - Las firmas son las mismas: async sGet(key) → data
   ========================================================= */

// [CONFIG] Nombre de tu empresa
const COMPANY_NAME = "Empresa Inspectora SA";

const {useState, useEffect, useRef, Fragment} = React;

/* ---- Storage (localStorage) ---- */
function sGet(k) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
  catch(e) { return null; }
}
function sSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e) { return false; }
}
function sDel(k) {
  try { localStorage.removeItem(k); return true; }
  catch(e) { return false; }
}

/* ---- Datos de demostración ---- */
// [CONFIG] Modificar usuarios reales aquí antes de publicar
const DEMO_USERS = [
  {id:"u0", name:"Administrador", email:"admin@empresa.com", password:"admin123", role:"admin", company:COMPANY_NAME},
  {id:"u1", name:"Carlos Mendez", email:"carlos@operadora.com", password:"demo123", role:"client", company:"Operadora Mendoza SRL"},
  {id:"u2", name:"Claudio Ríos", email:"claudio@petro.com", password:"demo123", role:"client", company:"Petro Sur SA"},
];

const DEMO_REPORTS = [
  {
    id:"r1", clientIds:["u1"], reportNo:"RP-2025-001",
    date:"2025-05-10", component:"X-Over NC46 Pin × NC50 Caja, 6-1/2\" OD",
    result:"APROBADO", inspector:"J. Rodríguez", certNo:"DS1-ARG-0142",
    rig:"Rig Mendoza 7", well:"MM-023", company:"Operadora Mendoza SRL",
    location:"Mendoza", category:"3", comments:"Componente en buenas condiciones generales. Listo para servicio.",
    uploadedAt:"2025-05-10T10:00:00Z",
    visualInspection:{pinThread:"P",boxThread:"P",pinSeal:"P",boxSeal:"P",pinNeck:"P",boxExt:"P",bodyExt:"P",hb:"NA",bb:"NA",slipG:"NA",elevG:"P",marks:"P",dye:"NA",mpi:"NA"},
    measurements:{
      bodyOD:{nominal:"6.500",min:"6.468",max:"6.531",m1:"6.499",m2:"6.501",m3:"6.498"},
      pinTong:{nominal:"",min:"12",max:"",m1:"14.25",m2:"14.25",m3:""},

      boxTong:{nominal:"",min:"12",max:"",m1:"13.50",m2:"13.50",m3:""},

  },
  {
    id:"r2", clientIds:["u2"], reportNo:"RP-2025-002",
    date:"2025-05-08", component:"Sustituto NC50 Pin × NC46 Caja, 5\" OD",
    result:"RECHAZADO", inspector:"J. Rodríguez", certNo:"DS1-ARG-0142",
    rig:"Rig Neuquén 3", well:"NQ-017", company:"Petro Sur SA",
    location:"Neuquén", category:"4", comments:"Desgaste excesivo en OD de caja y daño en cara de sello de caja. Componente fuera de servicio.",
    uploadedAt:"2025-05-08T14:30:00Z",
    visualInspection:{pinThread:"P",boxThread:"F",pinSeal:"P",boxSeal:"F",pinNeck:"P",boxExt:"P",bodyExt:"P",hb:"P",bb:"NA",slipG:"NA",elevG:"NA",marks:"P",dye:"P",mpi:"P"},
    measurements:{
      bodyOD:{nominal:"5.000",min:"4.968",max:"5.031",m1:"4.999",m2:"4.997",m3:""},
      boxOD:{nominal:"6.500",min:"6.500",max:"",m1:"6.463",m2:"6.461",m3:""},
      boxTong:{nominal:"",min:"12",max:"",m1:"11.5",m2:"11.5",m3:""},
    }
  },
];

/* ---- Etiquetas DS-1 ---- */
const VIS_LABELS = {
  pinThread:"Roscas del Pin", boxThread:"Roscas de la Caja",
  pinSeal:"Cara de Sello del Pin", boxSeal:"Cara de Sello de la Caja",
  pinNeck:"Cuello del Pin", boxExt:"Superficie exterior de la Caja",
  bodyExt:"Superficie exterior del Cuerpo", hb:"Hardbanding",
  bb:"Boreback", slipG:"Ranura de Slip",
  elevG:"Ranura de Elevator", marks:"Marcado e Identificación",
  dye:"Líquidos Penetrantes", mpi:"MPI (Inspección magnética)"
};

const MEAS_LABELS = {
  bodyOD:"OD del Cuerpo", bodyID:"ID del Cuerpo",
  wallThk:"Espesor de Pared", length:"Longitud Total",
  bow:"Curvatura / Bow", pinTong:"Tong Space del Pin",
  pinLen:"Longitud del Pin", bevel:"Diámetro del Bisel",
  boxTong:"Tong Space de la Caja", boxOD:"OD de la Caja",
  cbDiam:"Diámetro Counterbore", cbDepth:"Profundidad Counterbore",
  sealShldr:"Ancho Hombro Sello"
};

/* ---- Helpers ---- */
function avg3(m) {
  const vs = [m.m1,m.m2,m.m3].filter(v=>v&&!isNaN(parseFloat(v))).map(parseFloat);
  if (!vs.length) return "";
  return (vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(3);
}

function evalSt(v, mn, mx) {
  if (v===undefined||v===null||v==="") return "e";
  const n = parseFloat(v); if (isNaN(n)) return "e";
  const hm = mn!==undefined&&mn!==null&&mn!==""&&!isNaN(parseFloat(mn));
  const hM = mx!==undefined&&mx!==null&&mx!==""&&!isNaN(parseFloat(mx));
  if (hm && n < parseFloat(mn)) return "f";
  if (hM && n > parseFloat(mx)) return "f";
  if (hm || hM) return "p";
  return "e";
}

function initials(name) {
  return name.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function fmtDate(d) {
  if (!d) return "—";
  try { return new Date(d).toLocaleDateString("es-AR", {day:"2-digit",month:"2-digit",year:"numeric"}); }
  catch(e) { return d; }
}

/* ---- ResultBadge ---- */
function ResultBadge({result}) {
  const cls = result==="APROBADO" ? "badge-pass" : result==="RECHAZADO" ? "badge-fail" : "badge-cond";
  const icon = result==="APROBADO" ? "ti-circle-check" : result==="RECHAZADO" ? "ti-circle-x" : "ti-alert-triangle";
  return React.createElement("span", {className:"badge "+cls},
    React.createElement("i",{className:"ti "+icon, style:{marginRight:3,fontSize:11}}), result||"—"
  );
}

  const [pass,setPass] = useState("");
  const [err,setErr] = useState("");
  const [loading,setLoading] = useState(false);

  const doLogin = async () => {
    setErr(""); setLoading(true);
    await new Promise(r=>setTimeout(r,300)); // UX delay
    const users = sGet("ds1-users") || DEMO_USERS;

/* ====================================================
   UPLOAD / IMPORT VIEW (Admin)
   ==================================================== */
function UploadView({users, reports, setReports, onMsg}) {
  const [json,setJson] = useState("");
  const [parsed,setParsed] = useState(null);
  const [assignTo,setAssignTo] = useState([]);
  const [err,setErr] = useState("");
  const [form,setForm] = useState({
    reportNo:"", date:new Date().toISOString().slice(0,10),
    component:"", company:"", rig:"", well:"", location:"",
    inspector:"", certNo:"", category:"3", result:"APROBADO", comments:""
  });

  const clients = users.filter(u=>u.role==="client");

  const parseJson = () => {
    setErr(""); setParsed(null);
    try {
      const d = JSON.parse(json);
      const ri = d.reportInfo||{};
      const co = d.component||{};
      setParsed(d);
      setForm(p=>({...p,
        reportNo: ri.reportNo||p.reportNo,
        date: ri.date||p.date,
        component: co.description||co.type||p.component,
        company: ri.client||p.company,
        rig: ri.rig||p.rig,
        well: ri.well||p.well,
        location: ri.location||p.location,
        inspector: ri.inspector||p.inspector,
        certNo: ri.certNo||p.certNo,
        category: ri.category||p.category,
        result: d.result||p.result,
        comments: d.comments||p.comments,
      }));
    } catch(e) {
      setErr("JSON inválido. Verificá que copiaste el archivo exportado completo desde el formulario de inspección.");
    }
  };

  const save = () => {
    setErr("");
    if (!form.reportNo.trim()) { setErr("El N° de Reporte es obligatorio."); return; }
    if (assignTo.length===0) { setErr("Seleccioná al menos un cliente al que asignar el reporte."); return; }
    if (reports.find(r=>r.reportNo===form.reportNo.trim())) {
      setErr("Ya existe un reporte con ese número. Usá uno diferente.");
      return;
    }
    const newR = {
      id: "r"+Date.now(),
      clientIds: assignTo,
      ...form,
      uploadedAt: new Date().toISOString(),
      visualInspection: parsed?.visualInspection||{},
      measurements: parsed?.measurements||{},
    };
    const updated = [...reports, newR];
    sSet("ds1-reports", updated);
    setReports(updated);
    setJson(""); setParsed(null); setAssignTo([]);
    setForm({reportNo:"",date:new Date().toISOString().slice(0,10),component:"",company:"",rig:"",well:"",location:"",inspector:"",certNo:"",category:"3",result:"APROBADO",comments:""});
    onMsg("Reporte publicado y disponible para el cliente.");

  const setF = (k,v) => setForm(p=>({...p,[k]:v}));
  const togClient = id => setAssignTo(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);

      React.createElement("label",{className:"lbl"},"JSON del formulario de inspección"),
      React.createElement("textarea",{
        className:"inp",
        style:{minHeight:90,fontFamily:"monospace",fontSize:11},
        placeholder:'{ "reportInfo": { "reportNo": "RP-2025-001", ... }, "result": "APROBADO", ... }',
        value:json,
        onChange:e=>{setJson(e.target.value);setParsed(null);}
      }),
      React.createElement("div",{style:{marginTop:8,display:"flex",gap:8}},
        React.createElement("button",{className:"btn btn-primary",onClick:parseJson},
          React.createElement("i",{className:"ti ti-braces"}), " Importar JSON"
        ),
        json&&React.createElement("button",{className:"btn",onClick:()=>{setJson("");setParsed(null);}},
          React.createElement("i",{className:"ti ti-x"}), " Limpiar"
        )
      ),
      parsed && React.createElement("div",{className:"alert alert-ok",style:{marginTop:10}},
        React.createElement("i",{className:"ti ti-check"}),
        "JSON importado correctamente. Los campos se completaron abajo — verificá y ajustá si es necesario."

    React.createElement("div",{className:"divider-label"},
      React.createElement("span",null,"Datos del reporte")

      React.createElement("div",{className:"form-group"},

/* ====================================================
   CLIENTS VIEW (Admin)
   ==================================================== */
function ClientsView({users, setUsers}) {
  const [form,setForm] = useState({name:"",email:"",password:"",company:""});
  const [err,setErr] = useState("");
  const [ok,setOk] = useState("");

  const clients = users.filter(u=>u.role==="client");

  const addClient = () => {
    setErr(""); setOk("");
    if (!form.name||!form.email||!form.password||!form.company) { setErr("Todos los campos son obligatorios."); return; }
    if (users.find(u=>u.email.toLowerCase()===form.email.toLowerCase())) { setErr("Ya existe un usuario con ese email."); return; }
    const newU = {id:"u"+Date.now(), role:"client", ...form};
    const updated = [...users, newU];
    sSet("ds1-users", updated);
    setUsers(updated);
    setForm({name:"",email:"",password:"",company:""});
    setOk("Cliente creado. Ya puede ingresar al portal con sus credenciales.");
  };

  const delClient = (id) => {
    if (!confirm("¿Eliminar este cliente? Sus reportes asignados no se borrarán.")) return;
    const updated = users.filter(u=>u.id!==id);
    sSet("ds1-users", updated);
    setUsers(updated);
  };

  return React.createElement("div",null,
    React.createElement("div",{className:"tbl-wrap",style:{marginBottom:20}},
      React.createElement("table",{className:"tbl"},
        React.createElement("thead",null,
          React.createElement("tr",null,
            React.createElement("th",null,"Nombre"),
            React.createElement("th",null,"Email (login)"),
            React.createElement("th",null,"Empresa"),
            React.createElement("th",null,"Acciones")
          )
        ),
        React.createElement("tbody",null,
          clients.length===0
            ? React.createElement("tr",null,React.createElement("td",{colSpan:4,style:{textAlign:"center",color:"var(--text3)",padding:24}},"No hay clientes registrados aún."))
            : clients.map(c=>React.createElement("tr",{key:c.id},
                React.createElement("td",{style:{fontWeight:500}},
                  React.createElement("span",{style:{display:"inline-flex",alignItems:"center",justifyContent:"center",width:26,height:26,borderRadius:"50%",background:"var(--blue-bg)",color:"var(--blue-text)",fontSize:10,fontWeight:700,marginRight:8}},initials(c.name)),
                  c.name
                ),
                React.createElement("td",{style:{fontFamily:"monospace",fontSize:12}},c.email),
                React.createElement("td",null,c.company),
                React.createElement("td",null,
                  React.createElement("button",{className:"btn btn-sm btn-danger",onClick:()=>delClient(c.id)},
                    React.createElement("i",{className:"ti ti-trash"}), " Eliminar"
                  )
                )
              ))
        )
      )
    ),

    React.createElement("div",{className:"card"},
      React.createElement("div",{style:{fontSize:13,fontWeight:600,marginBottom:14,color:"var(--text)"}},
        React.createElement("i",{className:"ti ti-user-plus",style:{marginRight:6}}),
        "Agregar nuevo cliente"
      ),
      err && React.createElement("div",{className:"alert alert-err"},React.createElement("i",{className:"ti ti-alert-circle"}),err),
      ok  && React.createElement("div",{className:"alert alert-ok"}, React.createElement("i",{className:"ti ti-check"}),ok),
      React.createElement("div",{className:"form-row form-row-2"},
        React.createElement("div",{className:"form-group"},
          React.createElement("label",{className:"lbl"},"Nombre completo"),
          React.createElement("input",{className:"inp",value:form.name,onChange:e=>setForm(p=>({...p,name:e.target.value}))})
        ),
        React.createElement("div",{className:"form-group"},
          React.createElement("label",{className:"lbl"},"Empresa"),
          React.createElement("input",{className:"inp",value:form.company,onChange:e=>setForm(p=>({...p,company:e.target.value}))})
        )
      ),
      React.createElement("div",{className:"form-row form-row-2"},
        React.createElement("div",{className:"form-group"},
          React.createElement("label",{className:"lbl"},"Email (se usa para ingresar)"),
          React.createElement("input",{type:"email",className:"inp",value:form.email,onChange:e=>setForm(p=>({...p,email:e.target.value}))})
        ),
        React.createElement("div",{className:"form-group"},

          React.createElement("input",{type:"text",className:"inp",value:form.password,onChange:e=>setForm(p=>({...p,password:e.target.value})),placeholder:"El cliente puede cambiarla después"})

/* ====================================================
   PDF GENERATOR — funciona en celular y desktop
   ==================================================== */
function generatePDF(report) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const margin = 14;
  const pageW = 210;
  const contentW = pageW - margin * 2;
  const lineH = 6.5;
  let y = 0;

  const checkPage = (needed=10) => {
    if (y + needed > 278) { doc.addPage(); y = 20; }
  };

  const addSectionHeader = (title) => {
    checkPage(12);
    y += 3;
    doc.setFillColor(237,242,255);
    doc.rect(margin, y-4, contentW, 8, 'F');
    doc.setDrawColor(180,190,230);
    doc.rect(margin, y-4, contentW, 8, 'S');
    doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    doc.setTextColor(30,64,175);
    doc.text(title.toUpperCase(), margin+2, y+1);
    doc.setTextColor(0,0,0);
    y += 7;
  };

  const addField = (label, value, x2=margin+48) => {
    checkPage();
    doc.setFontSize(8); doc.setFont('helvetica','bold');
    doc.setTextColor(100,110,130);
    doc.text(label+':', margin+2, y);
    doc.setFont('helvetica','normal');
    doc.setTextColor(20,20,20);
    const lines = doc.splitTextToSize(value||'—', contentW - (x2 - margin) - 2);
    doc.text(lines, x2, y);
    y += Math.max(lineH, lines.length * lineH);
  };

  // ── HEADER AZUL ──
  doc.setFillColor(29,78,216);
  doc.rect(0,0,210,28,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text('REPORTE DE INSPECCIÓN DE SUSTITUTO', margin, 11);
  doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text('DS-1® Volumen 3 y Addendum — Categoría '+report.category, margin, 18);
  doc.setFontSize(9); doc.setFont('helvetica','bold');
  doc.text(report.reportNo||'', pageW-margin, 11, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text(fmtDate(report.date), pageW-margin, 18, {align:'right'});

  // ── RESULTADO BADGE ──
  const rc = report.result==='APROBADO'?[21,128,61]:report.result==='RECHAZADO'?[220,38,38]:[217,119,6];
  doc.setFillColor(...rc);
  doc.roundedRect(pageW-margin-38, 20, 38, 9, 2, 2, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(report.result||'—', pageW-margin-19, 25.5, {align:'center'});
  doc.setTextColor(0,0,0);
  y = 36;

  // ── IDENTIFICACIÓN ──
  addSectionHeader('Identificación del Componente');
  addField('Componente', report.component);
  addField('Empresa cliente', report.company);
  const col2x = margin + 95;
  checkPage();
  doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(100,110,130);
  doc.text('Equipo / Rig:', margin+2, y); doc.text('Pozo:', col2x, y);
  doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20);
  doc.text(report.rig||'—', margin+26, y); doc.text(report.well||'—', col2x+14, y);
  y += lineH;
  doc.setFont('helvetica','bold'); doc.setTextColor(100,110,130);
  doc.text('Ubicación:', margin+2, y); doc.text('Inspector:', col2x, y);
  doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20);
  doc.text(report.location||'—', margin+22, y); doc.text(report.inspector||'—', col2x+20, y);
  y += lineH;
  doc.setFont('helvetica','bold'); doc.setTextColor(100,110,130);
  doc.text('Cert. DS-1:', margin+2, y);
  doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20);
  doc.text(report.certNo||'—', margin+24, y);
  y += lineH;

  // ── INSPECCIÓN VISUAL ──
  const vis = report.visualInspection||{};
  const visPairs = Object.entries(VIS_LABELS).filter(([k])=>vis[k]&&vis[k]!=='NA');
  if (visPairs.length>0) {
    addSectionHeader('Inspección Visual');
    visPairs.forEach(([k,label])=>{
      checkPage();
      const v = vis[k];
      doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20);
      doc.text(label, margin+2, y);
      if (v==='P') doc.setTextColor(21,128,61);
      else if (v==='F') doc.setTextColor(220,38,38);
      doc.setFont('helvetica','bold');
      doc.text(v==='P'?'✓ Aprobado':'✗ Rechazado', pageW-margin, y, {align:'right'});
      doc.setTextColor(0,0,0);
      y += lineH;
    });
  }

  // ── MEDICIONES ──
  const meas = report.measurements||{};
  const measPairs = Object.entries(MEAS_LABELS).filter(([k])=>meas[k]&&(meas[k].m1||meas[k].m2||meas[k].m3));
  if (measPairs.length>0) {
    addSectionHeader('Mediciones Dimensionales');
    checkPage(10);
    // Cabecera tabla
    doc.setFillColor(220,225,235);
    doc.rect(margin, y-4, contentW, 7, 'F');
    doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(60,70,90);
    const cols = [margin+2, margin+56, margin+71, margin+87, margin+103, margin+119, margin+135, margin+152];
    ['Parámetro','Mín','Máx','Med 1','Med 2','Med 3','Prom.','Estado'].forEach((h,i)=>doc.text(h,cols[i],y));
    doc.setTextColor(0,0,0); y+=7;

    measPairs.forEach(([k,label])=>{
      checkPage();
      const m = meas[k];
      const a = avg3(m);
      const st = evalSt(a||m.m1, m.min, m.max);
      doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20);
      doc.text(label.slice(0,24), cols[0], y);
      doc.text(m.min||'—', cols[1], y);
      doc.text(m.max||'—', cols[2], y);
      doc.text(m.m1||'—', cols[3], y);
      doc.text(m.m2||'—', cols[4], y);
      doc.text(m.m3||'—', cols[5], y);
      if (st==='p') doc.setTextColor(21,128,61);
      else if (st==='f') doc.setTextColor(220,38,38);
      doc.setFont('helvetica','bold');
      doc.text(a||'—', cols[6], y);
      doc.text(st==='p'?'✓ OK':st==='f'?'✗ Falla':'—', cols[7], y);
      doc.setTextColor(0,0,0);
      y += lineH;
    });
  }

  // ── OBSERVACIONES ──
  if (report.comments) {
    addSectionHeader('Observaciones');
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    const lines = doc.splitTextToSize(report.comments, contentW-4);
    checkPage(lines.length * lineH + 5);
    doc.text(lines, margin+2, y);
    y += lines.length * lineH + 3;
  }

  // ── RESULTADO FINAL ──
  checkPage(20);
  y += 4;
  doc.setFillColor(...rc);
  doc.roundedRect(margin, y-4, contentW, 14, 2, 2, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(12); doc.setFont('helvetica','bold');
  doc.text((report.result==='APROBADO'?'✓ ':'✗ ')+'RESULTADO: '+(report.result||'—'), margin+5, y+5);
  doc.setTextColor(0,0,0); y += 20;

  // ── CERTIFICACIÓN ──
  addSectionHeader('Certificación del Inspector');
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text('El inspector certifica que la inspección fue realizada conforme a DS-1® Vol 3 y Addendum vigentes.', margin+2, y);
  y += 14;
  doc.line(margin, y, margin+55, y);
  doc.line(margin+65, y, margin+120, y);
  doc.line(margin+130, y, pageW-margin, y);
  y += 4;
  doc.setFontSize(7.5);
  doc.text('Inspector: '+(report.inspector||'—'), margin, y);
  doc.text('Fecha: '+fmtDate(report.date), margin+65, y);
  doc.text('Firma cliente: ___________', margin+130, y);
  y += 4;
  doc.setTextColor(100,110,130);
  doc.text('Cert. DS-1: '+(report.certNo||'—'), margin, y);

  // ── PIE DE PÁGINA ──
  const totalPages = doc.getNumberOfPages();
  for (let i=1; i<=totalPages; i++) {
    doc.setPage(i);
    doc.setFontSize(7); doc.setTextColor(160,160,160);
    doc.text(COMPANY_NAME+' | Portal DS-1 | Pág. '+i+'/'+totalPages, pageW/2, 290, {align:'center'});
    doc.line(margin, 286, pageW-margin, 286);
  }

  doc.save('DS1_'+(report.reportNo||'reporte')+'.pdf');
}

/* ====================================================
   MAIN APP
   ==================================================== */
function App() {
  const [appLoading, setAppLoading] = useState(true);
  const [users,   setUsers]   = useState([]);
  const [reports, setReports] = useState([]);
  const [user,    setUser]    = useState(null);
  const [tab,     setTab]     = useState("reports");
  const [selected,setSelected]= useState(null);
  const [toast,   setToast]   = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);

  useEffect(()=>{
    let u = sGet("ds1-users");
    let r = sGet("ds1-reports");
    if (!u || u.length===0) { u = DEMO_USERS; sSet("ds1-users",u); }
    if (!r || r.length===0) { r = DEMO_REPORTS; sSet("ds1-reports",r); }
    setUsers(u); setReports(r); setAppLoading(false);
  },[]);

  useEffect(()=>{
    if (toast) { const t=setTimeout(()=>setToast(""),4000); return()=>clearTimeout(t); }
  },[toast]);

  if (appLoading) return React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"var(--text2)"}},
    React.createElement("i",{className:"ti ti-loader-2",style:{fontSize:24,marginRight:10}}),
    "Cargando portal..."
  );

  if (!user) return React.createElement(LoginView,{onLogin:u=>{setUser(u);setTab("reports");}});

  const navItems = user.role==="admin"
    ? [
        {id:"reports", icon:"ti-file-text",    label:"Reportes"},
        {id:"clients", icon:"ti-users",         label:"Clientes"},
        {id:"upload",  icon:"ti-cloud-upload",  label:"Subir reporte"},
      ]
    : [{id:"reports", icon:"ti-file-text", label:"Mis informes"}];

  const headerTitle = selected
    ? "Detalle del reporte"
    : tab==="reports" ? (user.role==="admin"?"Todos los reportes":"Mis informes")
    : tab==="clients" ? "Gestión de clientes"
    : "Subir reporte";

  return React.createElement("div",{className:"portal-layout"},
    // Sidebar
    React.createElement("div",{className:"sidebar"+(sidebarOpen?" open":"")},
      React.createElement("div",{className:"sb-brand"},
        React.createElement("div",{className:"sb-brand-logo"},
          React.createElement("div",{className:"sb-brand-icon"},
            React.createElement("i",{className:"ti ti-file-certificate"})
          ),
          React.createElement("div",null,
            // [CONFIG] Nombre del portal
            React.createElement("div",{className:"sb-brand-name"},"Portal DS-1"),
            React.createElement("div",{className:"sb-brand-tagline"},"Informes técnicos")
          )
        )
      ),
      React.createElement("div",{className:"sb-user"},
        React.createElement("div",{className:"sb-avatar"},initials(user.name)),
        React.createElement("div",{style:{overflow:"hidden"}},
          React.createElement("div",{className:"sb-uname"},user.name),
          React.createElement("div",{className:"sb-ucmp"},user.company)
        )
      ),
      React.createElement("div",{className:"sb-nav"},
        React.createElement("div",{className:"sb-section-label"},"Navegación"),
        navItems.map(n=>React.createElement("div",{
          key:n.id,
          className:"sb-link"+(tab===n.id&&!selected?" active":""),
          onClick:()=>{setTab(n.id);setSelected(null);setSidebarOpen(false);}
        },
          React.createElement("i",{className:"ti "+n.icon}), n.label
        ))
      ),
      React.createElement("div",{className:"sb-footer"},
        React.createElement("div",{style:{fontSize:10,color:"var(--text3)",marginBottom:8}},
          React.createElement("span",{className:"sb-badge "+(user.role==="admin"?"sb-badge-admin":"sb-badge-client")},
            user.role==="admin"?"Administrador":"Cliente"
          )
        ),
        React.createElement("button",{
          className:"btn",style:{width:"100%",fontSize:12,justifyContent:"center"},
          onClick:()=>{setUser(null);setSelected(null);setTab("reports");}
        },
          React.createElement("i",{className:"ti ti-logout"}), " Cerrar sesión"
        )
      )
    ),

    // Main
    React.createElement("div",{className:"main-area"},
      React.createElement("div",{className:"main-header"},
        React.createElement("button",{className:"hamburger",onClick:()=>setSidebarOpen(p=>!p),"aria-label":"Menú"},
          React.createElement("i",{className:"ti ti-menu-2"})
        ),
        React.createElement("div",null,
          React.createElement("div",{className:"main-header-title"},headerTitle),
          React.createElement("div",{className:"main-header-sub"},
            selected ? "Reporte "+selected.reportNo : user.company
          )
        ),
        toast && React.createElement("div",{className:"alert alert-ok",style:{margin:0,padding:"6px 12px",fontSize:12}},
          React.createElement("i",{className:"ti ti-check"}), toast
        )
      ),

      React.createElement("div",{className:"main-content"},
        selected
          ? React.createElement(ReportDetailView,{report:selected, onBack:()=>setSelected(null)})
          : tab==="upload"
          ? React.createElement(UploadView,{users,reports,setReports,onMsg:m=>{setToast(m);setTab("reports");}})
          : tab==="clients"
          ? React.createElement(ClientsView,{users,setUsers})
          : React.createElement(ReportsView,{reports,user,users,setSelectedReport:setSelected})
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
