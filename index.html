<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal DS-1 — GM Robótica</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<!-- ============================================================
  PORTAL DS-1 — Versión Supabase (Backend Real)
  
  CONFIGURACIÓN INICIAL (obligatorio):
  1. Creá tu proyecto gratuito en https://supabase.com
  2. En Supabase → SQL Editor → pegá y ejecutá el archivo schema-supabase.sql
  3. En Supabase → Settings → API → copiá "Project URL" y "anon public key"
  4. Pegá los valores en SUPABASE_URL y SUPABASE_ANON_KEY abajo
  5. Abrí este archivo en tu navegador
  6. Registrate con tu email → luego en SQL Editor ejecutá:
     UPDATE profiles SET role = 'admin' WHERE id = (
       SELECT id FROM auth.users WHERE email = 'TU_EMAIL'
     );
  ============================================================ -->

<style>
:root{
  --bg:#111111;--bg2:#1a1a1a;--bg3:#222222;
  --border:#2d2d2d;--border2:#3a3a3a;
  --text:#f0f0f0;--text2:#a0a0a0;--text3:#666666;
  --blue:#f97316;--blue-bg:rgba(249,115,22,.15);--blue-text:#fb923c;
  --green:#22c55e;--green-bg:rgba(34,197,94,.12);--green-text:#4ade80;
  --red:#ef4444;--red-bg:rgba(239,68,68,.12);--red-text:#f87171;
  --amber:#f59e0b;--amber-bg:rgba(245,158,11,.12);--amber-text:#fbbf24;
  --radius:6px;--shadow:0 2px 12px rgba(0,0,0,.5)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--text);background:var(--bg2)}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}

/* Layout */
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;min-width:210px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Sidebar */
.sb-brand{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-icon{width:34px;height:34px;background:linear-gradient(135deg,#f97316,#ea580c);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.sb-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.2}
.sb-tag{font-size:10px;color:var(--text3)}
.sb-user{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sb-av{width:30px;height:30px;border-radius:50%;background:var(--blue-bg);color:var(--blue-text);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-ucmp{font-size:10px;color:var(--text3)}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto}
.sb-lbl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:8px 14px 3px}
.sb-link{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border-left:3px solid transparent;transition:all .1s}
.sb-link:hover{background:var(--bg2);color:var(--text);border-left-color:var(--border2)}
.sb-link.active{background:rgba(249,115,22,.08);color:#f97316;border-left-color:#f97316;font-weight:700}
.sb-link i{font-size:16px;flex-shrink:0}
.sb-foot{padding:12px 14px;border-top:1px solid var(--border)}

/* Main header */
.mhdr{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;gap:12px;min-height:54px}
.mhdr-title{font-size:15px;font-weight:700;color:var(--text)}
.mhdr-sub{font-size:11px;color:var(--text3);margin-top:1px}
.mcontent{flex:1;overflow-y:auto;padding:20px;background:var(--bg2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;font-size:12px;font-weight:600;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;white-space:nowrap;transition:all .1s}
.btn:hover{background:var(--bg2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border-color:#f97316}
.btn-primary:hover{opacity:.9}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-success:hover{opacity:.9}
.btn-danger{background:var(--red-bg);color:var(--red-text);border-color:var(--red)}
.btn-sm{padding:4px 10px;font-size:11px}

/* Inputs */
.inp{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:inherit;font-size:13px}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(29,78,216,.1)}
textarea.inp{resize:vertical;min-height:60px;line-height:1.5}
.lbl{display:block;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.form-group{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* Cards */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:26px;font-weight:700;line-height:1}
.stat-lbl{font-size:10px;color:var(--text2);margin-top:4px}

/* Alerts */
.alert{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border-radius:var(--radius);font-size:12px;margin-bottom:12px}
.alert-ok{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green)}
.alert-err{background:var(--red-bg);color:var(--red-text);border:1px solid var(--red)}
.alert-info{background:var(--blue-bg);color:var(--blue-text);border:1px solid var(--blue)}
.alert i{font-size:16px;flex-shrink:0;margin-top:1px}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700}
.badge-pass{background:var(--green-bg);color:var(--green-text)}
.badge-fail{background:var(--red-bg);color:var(--red-text)}
.badge-cond{background:var(--amber-bg);color:var(--amber-text)}
.badge-admin{background:var(--blue-bg);color:var(--blue-text)}
.badge-grey{background:var(--bg3);color:var(--text2)}

/* Table */
.tbl-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl thead{background:var(--bg2)}
.tbl th{padding:9px 12px;text-align:left;font-size:9px;font-weight:700;color:var(--text2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--bg2)}
.tbl-search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}

/* Login */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 60% 40%, rgba(249,115,22,.08) 0%, #111 60%);padding:20px}
.login-card{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.08)}

/* Drop zone */
.dropzone{border:2px dashed var(--border2);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;background:var(--bg2);transition:all .2s;margin-bottom:12px}
.dropzone:hover,.dropzone.drag{border-color:var(--blue);background:var(--blue-bg)}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty i{font-size:34px;display:block;margin-bottom:10px}

/* Mobile bottom nav */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:6px 0 10px;z-index:200;justify-content:space-around}
.mob-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:700;color:var(--text3);cursor:pointer;padding:4px 12px;text-transform:uppercase;letter-spacing:.3px}
.mob-nav-item i{font-size:22px}
.mob-nav-item.active{color:var(--blue)}
.mob-spacer{height:68px}

/* Report detail */
.rpt-section{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--bg)}
.rpt-hdr{background:var(--bg2);padding:8px 14px;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.rpt-body{padding:12px 14px}
.rpt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rpt-field label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:700;display:block;margin-bottom:2px}
.rpt-field span{font-size:12px;color:var(--text);font-weight:500}
.cell-pass{color:var(--green);font-weight:700}
.cell-fail{color:var(--red);font-weight:700}

/* Config warning */
.config-warning{max-width:600px;margin:60px auto;padding:30px;background:var(--bg);border:2px solid var(--amber);border-radius:12px;text-align:center}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;box-shadow:0 4px 20px rgba(0,0,0,.15);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;max-width:340px;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-color:var(--green);color:var(--green-text);background:var(--green-bg)}
.toast.err{border-color:var(--red);color:var(--red-text);background:var(--red-bg)}

@media(max-width:768px){
  .sidebar{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .rpt-grid{grid-template-columns:1fr 1fr}
  .mob-nav{display:flex}
  .mcontent{padding:12px}
  .tbl-wrap{overflow-x:auto}
  .mhdr{padding:10px 14px}
}
@media print{
  .sidebar,.mhdr,.mob-nav,.btn,.no-print{display:none!important}
  .layout{display:block;height:auto}
  .main{overflow:visible}
  .mcontent{overflow:visible;padding:0}
  @page{margin:1.5cm}
}
</style>
</head>
<body>

<!-- Toast -->
<div id="toast" class="toast"></div>
<div id="app"></div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- pdf-lib for watermark -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>

/* ============================================================
   ⚙️  CONFIGURACIÓN — COMPLETAR CON TUS DATOS DE SUPABASE
   ============================================================
   1. Ir a https://supabase.com → tu proyecto → Settings → API
   2. Copiar "Project URL" y "anon public" key
   ============================================================ */
const SUPABASE_URL  = 'https://ysuwpuaucfvnqlfnczlu.supabase.co';   // ← CAMBIAR
const SUPABASE_ANON = 'sb_publishable_CxmuobEx8KuXI5hbD8dfog_XP19xUW-';                  // ← CAMBIAR

// [CONFIG] Nombre de tu empresa inspectora
const COMPANY_NAME  = 'GM Robótica';

/* ============================================================ */

const IS_CONFIGURED = !SUPABASE_URL.includes('TU_PROYECTO') && !SUPABASE_ANON.includes('TU_ANON');
const sb = IS_CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

/* ── State global ── */
let state = {
  user: null,
  profile: null,
  tab: 'reports',
  selected: null,
  toast: null,
};

/* ── Helpers ── */
const $ = id => document.getElementById(id);
const fmtDate = d => { try { return new Date(d).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}); } catch(e){return d||'—';} };
const fmtDT = d => { try { return new Date(d).toLocaleString('es-AR'); } catch(e){return d||'—';} };
const initials = n => n?.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const resultBadge = r => {
  const cls = r==='APROBADO'?'badge-pass':r==='RECHAZADO'?'badge-fail':'badge-cond';
  const icon = r==='APROBADO'?'ti-circle-check':r==='RECHAZADO'?'ti-circle-x':'ti-alert-triangle';
  return `<span class="badge ${cls}"><i class="ti ${icon}" style="font-size:10px;margin-right:2px"></i>${r||'—'}</span>`;
};

const VIS_LABELS = {pinThread:'Roscas Pin',boxThread:'Roscas Caja',pinSeal:'Sello Pin',boxSeal:'Sello Caja',pinNeck:'Cuello Pin',boxExt:'Ext Caja',bodyExt:'Cuerpo',hb:'Hardbanding',bb:'Boreback',slipG:'Ranura Slip',elevG:'Ranura Elevator',marks:'Marcado',dye:'Líq. Penetrantes',mpi:'MPI'};
const MEAS_LABELS = {bodyOD:'OD Cuerpo',bodyID:'ID Cuerpo',wallThk:'Esp. Pared',totalLen:'Longitud',bow:'Curvatura',pinTong:'Tong Space Pin',pinLen:'Long. Pin',bevel:'Bisel Pin',boxTong:'Tong Space Caja',boxOD:'OD Caja',cbDiam:'Ø Counterbore',cbDepth:'Prof. Counterbore',sealShldr:'Ancho Sello'};

function showToast(msg, type='ok') {
  const t = $('toast');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="ti ti-${type==='ok'?'circle-check':'alert-circle'}"></i> ${msg}`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

function avg3(m) {
  const vs=[m?.m1,m?.m2,m?.m3].filter(v=>v!==''&&v!=null&&!isNaN(parseFloat(v))).map(parseFloat);
  if(!vs.length) return '';
  return(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(3);
}
function evalSt(v,mn,mx) {
  if(v===''||v==null) return 'e';
  const n=parseFloat(v);if(isNaN(n))return 'e';
  const hm=mn!=null&&mn!==''&&!isNaN(parseFloat(mn));
  const hM=mx!=null&&mx!==''&&!isNaN(parseFloat(mx));
  if(hm&&n<parseFloat(mn))return 'f';
  if(hM&&n>parseFloat(mx))return 'f';
  if(hm||hM)return 'p';
  return 'e';
}

/* ── Audit Log ── */
async function logEvent(event, reportId=null, reportNo=null, meta={}) {
  if(!sb||!state.profile) return;
  try {
    await sb.from('audit_logs').insert({
      event, user_id:state.user.id,
      user_name:state.profile.full_name,
      user_company:state.profile.company,
      report_id:reportId, report_no:reportNo,
      metadata:meta,
    });
  } catch(e) { console.warn('Audit log error:', e); }
}

/* ── PDF Watermark ── */
async function downloadPDF(report) {
  showToast('Generando PDF con marca de agua...', 'ok');
  try {
    const { PDFDocument, rgb, StandardFonts, degrees } = window.PDFLib;

    // Try to load existing PDF from Supabase Storage if available
    // Otherwise generate from report data
    let pdfDoc;
    const storageKey = `reports/${report.id}.pdf`;
    let loadedFromStorage = false;

    try {
      const { data, error } = await sb.storage.from('reports').download(storageKey);
      if (data && !error) {
        const arrayBuffer = await data.arrayBuffer();
        pdfDoc = await PDFDocument.load(arrayBuffer);
        loadedFromStorage = true;
      }
    } catch(e) { /* generate from data */ }

    if (!loadedFromStorage) {
      pdfDoc = await generatePDFFromData(report);
    }

    // ── Add watermark to every page ──
    const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const fontLight = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const now = new Date();
    const downloadId = Math.random().toString(36).slice(2,10).toUpperCase();
    const wm1 = `DESCARGADO POR: ${state.profile.full_name} — ${state.profile.company}`;
    const wm2 = `Fecha: ${now.toLocaleString('es-AR')} | ID: ${downloadId}`;
    const wm3 = `USO CONFIDENCIAL — Prohibida su reproducción sin autorización`;

    pdfDoc.getPages().forEach(page => {
      const { width, height } = page.getSize();
      const cx = width / 2, cy = height / 2;

      // Diagonal watermark (large, transparent)
      page.drawText(state.profile.company?.toUpperCase()||'CONFIDENCIAL', {
        x: cx - 200, y: cy,
        size: 52, font, color: rgb(0.7,0.7,0.7), opacity: 0.07,
        rotate: degrees(45),
      });

      // Footer watermark bar
      const barH = 30;
      page.drawRectangle({ x:0, y:0, width, height:barH, color:rgb(0.13,0.31,0.85), opacity:0.08 });
      page.drawText(wm1, { x:10, y:barH-11, size:7, font, color:rgb(0.1,0.1,0.5), opacity:0.8 });
      page.drawText(wm2, { x:10, y:3, size:6, font:fontLight, color:rgb(0.2,0.2,0.5), opacity:0.7 });
      page.drawText(wm3, { x:width-280, y:3, size:5.5, font:fontLight, color:rgb(0.5,0.1,0.1), opacity:0.7 });
    });

    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type:'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `DS1_${report.report_no||'informe'}_${downloadId}.pdf`;
    a.click();
    URL.revokeObjectURL(url);

    // Log the download
    await logEvent('descarga_pdf', report.id, report.report_no, { downloadId });
    showToast(`PDF descargado con marca de agua — ID: ${downloadId}`, 'ok');

  } catch(err) {
    console.error(err);
    showToast('Error generando PDF: ' + err.message, 'err');
  }
}

/* ── Generate PDF from JSON report data ── */
async function generatePDFFromData(r) {
  const { PDFDocument, rgb, StandardFonts } = window.PDFLib;
  const doc = await PDFDocument.create();
  const fontB = await doc.embedFont(StandardFonts.HelveticaBold);
  const font  = await doc.embedFont(StandardFonts.Helvetica);

  const addPage = () => {
    const p = doc.addPage([595, 842]); // A4
    let y = 820;
    const margin = 40;
    const W = 515;

    // Header bar
    p.drawRectangle({ x:0, y:808, width:595, height:34, color:rgb(0.11,0.31,0.85) });
    p.drawText('REPORTE DE INSPECCIÓN DS-1 — Vol 3 y Addendum', { x:margin, y:817, size:10, font:fontB, color:rgb(1,1,1) });
    p.drawText(`${r.report_no||'—'}  |  ${fmtDate(r.date)}`, { x:595-160, y:817, size:9, font, color:rgb(0.8,0.9,1) });
    y = 795;

    return { p, y: [y], margin, W };
  };

  const field = (p, x, y, label, value, labelColor=rgb(0.4,0.4,0.4)) => {
    p.drawText(label+':',{ x, y:y+2, size:7, font:fontB, color:labelColor });
    p.drawText(String(value||'—'),{ x, y:y-9, size:9, font, color:rgb(0.1,0.1,0.1) });
  };

  const secHeader = (p, y, text, W, margin) => {
    p.drawRectangle({ x:margin, y:y-2, width:W, height:14, color:rgb(0.93,0.96,1) });
    p.drawText(text, { x:margin+4, y:y+2, size:8, font:fontB, color:rgb(0.11,0.31,0.85) });
    return y - 20;
  };

  // Page 1
  let { p, y, margin, W } = addPage();
  let cy = y[0];

  // Component section
  cy = secHeader(p, cy, 'IDENTIFICACIÓN DEL COMPONENTE', W, margin);
  field(p, margin, cy, 'Componente', r.component); field(p, margin+180, cy, 'N° Reporte', r.report_no);
  cy -= 22;
  field(p, margin, cy, 'Empresa cliente', r.company); field(p, margin+180, cy, 'Equipo / Rig', r.rig); field(p, margin+340, cy, 'Pozo', r.well);
  cy -= 22;
  field(p, margin, cy, 'Inspector', r.inspector); field(p, margin+180, cy, 'Cert. DS-1', r.cert_no); field(p, margin+340, cy, 'Categoría', `Cat. ${r.category}`);
  cy -= 22;
  field(p, margin, cy, 'N° Serie', r.serial_no); field(p, margin+140, cy, 'N° Calor', r.heat_no); field(p, margin+280, cy, 'Fabricante', r.manufacturer); field(p, margin+400, cy, 'Grado', r.grade);
  cy -= 22;
  field(p, margin, cy, 'Conexión superior', r.conn_top); field(p, margin+220, cy, 'Conexión inferior', r.conn_bot); field(p, margin+440, cy, 'OD Nominal', r.nom_od?`${r.nom_od}"`:'—');
  cy -= 30;

  // Visual inspection
  const vis = r.visual_inspection||{};
  const visFail = Object.entries(vis).filter(([,v])=>v==='F');
  const visPass = Object.entries(vis).filter(([,v])=>v==='P');
  cy = secHeader(p, cy, 'INSPECCIÓN VISUAL', W, margin);
  if(visFail.length===0) {
    p.drawText('✓ Todos los ítems visuales APROBADOS', { x:margin+4, y:cy, size:9, font:fontB, color:rgb(0.09,0.5,0.24) });
  } else {
    p.drawText(`Ítems RECHAZADOS: ${visFail.map(([k])=>VIS_LABELS[k]||k).join(', ')}`, { x:margin+4, y:cy, size:8, font:fontB, color:rgb(0.86,0.15,0.15) });
  }
  cy -= 30;

  // Measurements
  const meas = r.measurements||{};
  const measEntries = Object.entries(MEAS_LABELS).filter(([k])=>meas[k]&&(meas[k].m1||meas[k].m2||meas[k].m3));
  if(measEntries.length>0) {
    cy = secHeader(p, cy, 'MEDICIONES DIMENSIONALES', W, margin);
    // Table header
    const cols = [margin, margin+120, margin+175, margin+230, margin+280, margin+330, margin+385, margin+440, margin+480];
    p.drawRectangle({ x:margin, y:cy-2, width:W, height:13, color:rgb(0.2,0.35,0.7), opacity:0.15 });
    ['Parámetro','Un','Mín','Máx','Med 1','Med 2','Med 3','Prom.','Est.'].forEach((h,i)=>{
      p.drawText(h,{x:cols[i]+2,y:cy+2,size:6.5,font:fontB,color:rgb(0.2,0.3,0.6)});
    });
    cy -= 13;
    measEntries.forEach(([k,label]) => {
      if(cy < 60) { /* new page if needed */ }
      const m = meas[k];
      const a = avg3(m);
      const st = evalSt(a||m.m1, m.min, m.max);
      const rowColor = st==='f'?rgb(1,0.9,0.9):st==='p'?rgb(0.9,1,0.93):rgb(1,1,1);
      p.drawRectangle({ x:margin, y:cy-1, width:W, height:12, color:rowColor, opacity:0.6 });
      p.drawText(label.slice(0,20),{x:cols[0]+2,y:cy+2,size:6.5,font,color:rgb(0.1,0.1,0.1)});
      p.drawText('in',{x:cols[1]+2,y:cy+2,size:6,font,color:rgb(0.5,0.5,0.5)});
      p.drawText(m.min||'',{x:cols[2]+2,y:cy+2,size:6.5,font,color:rgb(0.2,0.2,0.7)});
      p.drawText(m.max||'',{x:cols[3]+2,y:cy+2,size:6.5,font,color:rgb(0.2,0.2,0.7)});
      p.drawText(m.m1||'—',{x:cols[4]+2,y:cy+2,size:6.5,font,color:rgb(0.1,0.1,0.1)});
      p.drawText(m.m2||'—',{x:cols[5]+2,y:cy+2,size:6.5,font,color:rgb(0.1,0.1,0.1)});
      p.drawText(m.m3||'—',{x:cols[6]+2,y:cy+2,size:6.5,font,color:rgb(0.1,0.1,0.1)});
      if(a) p.drawText(a,{x:cols[7]+2,y:cy+2,size:6.5,font:fontB,color:st==='p'?rgb(0.09,0.5,0.24):st==='f'?rgb(0.86,0.15,0.15):rgb(0.1,0.1,0.1)});
      if(st!=='e') p.drawText(st==='p'?'✓ OK':'✗ Falla',{x:cols[8]+2,y:cy+2,size:6,font:fontB,color:st==='p'?rgb(0.09,0.5,0.24):rgb(0.86,0.15,0.15)});
      cy -= 12;
    });
    cy -= 10;
  }

  // Comments
  if(r.comments) {
    cy = secHeader(p, cy, 'OBSERVACIONES', W, margin);
    p.drawText(r.comments.slice(0,200),{x:margin+4,y:cy,size:8,font,color:rgb(0.2,0.2,0.2),maxWidth:W-8,lineHeight:11});
    cy -= 30;
  }

  // Result
  const rc = r.result==='APROBADO'?rgb(0.09,0.5,0.24):r.result==='RECHAZADO'?rgb(0.86,0.15,0.15):rgb(0.6,0.27,0.04);
  p.drawRectangle({ x:margin, y:cy-18, width:W, height:28, color:rc, opacity:0.12, borderColor:rc, borderOpacity:0.8, borderWidth:1 });
  p.drawText(`RESULTADO: ${r.result||'—'}`, { x:margin+8, y:cy-6, size:13, font:fontB, color:rc });
  cy -= 40;

  // Certification
  cy = secHeader(p, cy, 'CERTIFICACIÓN — DS-1 Vol 3 §1.5', W, margin);
  p.drawText('El inspector certifica que la inspección fue realizada conforme a DS-1® Vol 3 y Addendum vigentes.',
    {x:margin+4,y:cy,size:7.5,font,color:rgb(0.3,0.3,0.3)});
  cy -= 30;
  [0,1,2].forEach(i=>{
    p.drawLine({ start:{x:margin+i*175,y:cy}, end:{x:margin+i*175+140,y:cy}, thickness:0.5, color:rgb(0.5,0.5,0.5) });
    const lbls=['Inspector / Firma','Supervisor / Conformidad','Cliente / Recepción'];
    p.drawText(lbls[i],{x:margin+i*175,y:cy-12,size:6.5,font,color:rgb(0.5,0.5,0.5)});
    if(i===0){
      p.drawText(r.inspector||'',{x:margin,y:cy-22,size:7,font:fontB,color:rgb(0.2,0.2,0.2)});
      p.drawText(`Cert. DS-1: ${r.cert_no||'—'}`,{x:margin,y:cy-32,size:6.5,font,color:rgb(0.4,0.4,0.4)});
    }
    p.drawText(`Fecha: ${fmtDate(r.date)||''}`,{x:margin+i*175,y:cy-32,size:6.5,font,color:rgb(0.4,0.4,0.4)});
  });

  return doc;
}

/* ── Load tab content ── */
async function loadTab() {
  const isAdmin = state.profile?.role==='admin';
  if(state.selected) { await renderReportDetail(state.selected); return; }
  if(state.tab==='reports') await renderReports(isAdmin);
  else if(state.tab==='upload' && isAdmin) await renderUpload();
  else if(state.tab==='clients' && isAdmin) await renderClients();
  else if(state.tab==='auditlog' && isAdmin) await renderAuditLog();
}

function filterTable() {
  const q=($('srch')?.value||'').toLowerCase();
  const r=$('fil-result')?.value||'';
  const c=$('fil-cat')?.value||'';
  document.querySelectorAll('#reports-tbl tbody tr').forEach(tr=>{
    const text=(tr.dataset.text||'').toLowerCase();
    const result=tr.dataset.result||'';
    const cat=tr.dataset.cat||'';
    const ok=(!q||text.includes(q))&&(!r||result===r)&&(!c||cat===c);
    tr.style.display=ok?'':'none';
  });
}

function viewReport(tr) {
  try { state.selected=JSON.parse(tr.dataset.report); renderPortal($('app')); } catch(e){}
}

function downloadPDFFromRow(tr) {
  try { const r=JSON.parse(tr.dataset.report); downloadPDF(r); } catch(e){}
}

      </div>
    </div>
  </div>

  <!-- Visual -->
  ${visPairs.length?`<div class="rpt-section">
    <div class="rpt-hdr"><i class="ti ti-eye"></i>Inspección Visual</div>
    <div class="rpt-body" style="padding:0">
      <table class="tbl">
        <thead><tr><th>Ítem</th><th>Resultado</th></tr></thead>
        <tbody>${visPairs.map(([k,label])=>{const v=vis[k];return`<tr><td>${label}</td><td>${v==='P'?'<span class="cell-pass">✓ Aprobado</span>':v==='F'?'<span class="cell-fail">✗ Rechazado</span>':'<span style="color:var(--text3)">N/A</span>'}</td></tr>`;}).join('')}</tbody>
      </table>
    </div>
  </div>`:''}

  <!-- Measurements -->
  ${measPairs.length?`<div class="rpt-section">
    <div class="rpt-hdr"><i class="ti ti-ruler-measure"></i>Mediciones Dimensionales</div>
    <div class="rpt-body" style="padding:0;overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>Parámetro</th><th>Mín</th><th>Máx</th><th>Med 1</th><th>Med 2</th><th>Med 3</th><th>Promedio</th><th>Estado</th></tr></thead>
        <tbody>${measPairs.map(([k,label])=>{const m=meas[k]||{};const a=avg3(m);const st=evalSt(a||m.m1,m.min,m.max);return`<tr>
          <td style="font-weight:500">${label}</td>
          <td style="font-family:monospace;font-size:11px">${m.min||'—'}</td>
          <td style="font-family:monospace;font-size:11px">${m.max||'—'}</td>
          <td class="${evalSt(m.m1,m.min,m.max)==='p'?'cell-pass':evalSt(m.m1,m.min,m.max)==='f'?'cell-fail':''}">${m.m1||'—'}</td>
          <td class="${evalSt(m.m2,m.min,m.max)==='p'?'cell-pass':evalSt(m.m2,m.min,m.max)==='f'?'cell-fail':''}">${m.m2||'—'}</td>
          <td class="${evalSt(m.m3,m.min,m.max)==='p'?'cell-pass':evalSt(m.m3,m.min,m.max)==='f'?'cell-fail':''}">${m.m3||'—'}</td>
          <td class="${st==='p'?'cell-pass':st==='f'?'cell-fail':''}" style="font-family:monospace;font-weight:600">${a||'—'}</td>
          <td>${st==='p'?'<span class="cell-pass">✓ OK</span>':st==='f'?'<span class="cell-fail">✗ Falla</span>':'—'}</td>
        </tr>`;}).join('')}</tbody>
      </table>
    </div>
  </div>`:''}

  <!-- Comments -->
  ${r.comments?`<div class="rpt-section">
    <div class="rpt-hdr"><i class="ti ti-notes"></i>Observaciones</div>
    <div class="rpt-body"><p style="font-size:13px;line-height:1.7;color:var(--text)">${r.comments}</p></div>
  </div>`:''}

  <!-- Result -->
  <div class="rpt-section" style="border:2px solid ${r.result==='APROBADO'?'var(--green)':r.result==='RECHAZADO'?'var(--red)':'var(--amber)'}">
    <div style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:22px;font-weight:700;color:${r.result==='APROBADO'?'var(--green)':r.result==='RECHAZADO'?'var(--red)':'var(--amber)'}">
          ${r.result==='APROBADO'?'✓':'✗'} ${r.result||'—'}
        </div>
        <div style="font-size:12px;color:var(--text2);margin-top:3px">
          ${r.result==='APROBADO'?'Componente apto para servicio según DS-1 Vol 3':'Componente NO apto para servicio — ver observaciones'}
        </div>
      </div>
      <div style="text-align:right;font-size:11px;color:var(--text3)">
        Inspector: <strong>${r.inspector||'—'}</strong><br>
        Cert. DS-1: <strong>${r.cert_no||'—'}</strong>
      </div>
    </div>
  </div>`;
}

      <div class="grid4" style="margin-bottom:10px">

window.toggleClient=function(id){
  const sc=window._selectedClients;
  const idx=sc.indexOf(id);
  if(idx>=0){sc.splice(idx,1);}else{sc.push(id);}
  const btn=document.getElementById('cb-'+id);
  if(btn){
    btn.className='btn'+(sc.includes(id)?' btn-success':'');
    btn.innerHTML=`<i class="ti ti-${sc.includes(id)?'user-check':'user'}"></i> ${btn.textContent.replace(/✓?\s*/,'').trim()}`;
  }
};

window.loadJsonFile=function(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      const ri=d.reportInfo||d||{};
      const co=d.component||{};
      const connTop=(ri.topConnType||'')+(ri.topConnConfig?' '+ri.topConnConfig:'');
      const connBot=(ri.botConnType||'')+(ri.botConnConfig?' '+ri.botConnConfig:'');
      window._parsedReport={...d,_connTop:connTop,_connBot:connBot};

      // Fill form
      const set=(id,v)=>{if($(id)&&v)$(id).value=v;};
      set('u-reportno',ri.reportNo);
      set('u-date',ri.date);
      set('u-category',ri.category||'3');
      set('u-result',d.result||'APROBADO');
      set('u-component',co.description||co.type||ri.description||`${connTop} × ${connBot}`);
      set('u-company',ri.client||ri.company||'');
      set('u-rig',ri.rig||'');
      set('u-well',ri.well||'');
      set('u-location',ri.location||'');
      set('u-inspector',ri.inspector||'');
      set('u-certno',ri.certNo||'');
      set('u-serialno',co.serialNo||'');
      set('u-heatno',co.heatNo||'');
      set('u-manufacturer',co.manufacturer||'');
      set('u-comments',d.comments||'');

      $('upload-form').style.display='block';
      $('parse-result').innerHTML='';
    }catch(ex){
      $('parse-result').innerHTML=`<div class="alert alert-err"><i class="ti ti-alert-circle"></i>JSON inválido: ${ex.message}</div>`;
    }
  };
  reader.readAsText(file);
};

window.submitReport=async function(){
  const err=$('upload-err');
  const reportNo=$('u-reportno')?.value?.trim();
  if(!reportNo){err.innerHTML='<div class="alert alert-err"><i class="ti ti-alert-circle"></i>El N° de Reporte es obligatorio.</div>';return;}
  if(!window._selectedClients?.length){err.innerHTML='<div class="alert alert-err"><i class="ti ti-alert-circle"></i>Seleccioná al menos un cliente.</div>';return;}

  const d=window._parsedReport||{};
  const ri=d.reportInfo||{};
  const co=d.component||{};

  const reportData={
    report_no:$('u-reportno').value.trim(),
    date:$('u-date').value||null,
    revision:ri.revision||'0',
    component:$('u-component').value,
    type:co.type||'Sustituto',
    company:$('u-company').value,
    rig:$('u-rig').value,
    well:$('u-well').value,
    location:$('u-location').value,
    inspector:$('u-inspector').value,
    cert_no:$('u-certno').value,
    category:$('u-category').value,
    result:$('u-result').value,
    conn_top:d._connTop||ri.topConnType||'',
    conn_bot:d._connBot||ri.botConnType||'',
    serial_no:$('u-serialno').value,
    heat_no:$('u-heatno').value,
    manufacturer:$('u-manufacturer').value,
    material:co.material||'',
    grade:co.grade||'',
    nom_od:co.nomOD||'',
    nom_id:co.nomID||'',
    comp_length:co.length||co.compLength||'',
    weight:co.weight||'',
    makeup_torque:co.makeupTorque||'',
    comments:$('u-comments').value,
    visual_inspection:d.visualInspection||{},
    measurements:d.measurements||{},
    raw_data:d,
    uploaded_by:state.user.id,
    published:true,
  };

  const {data:rpt,error}=await sb.from('reports').insert(reportData).select().single();
  if(error){err.innerHTML=`<div class="alert alert-err"><i class="ti ti-alert-circle"></i>${error.message}</div>`;return;}

  // Assign to clients
  const assigns=window._selectedClients.map(cid=>({report_id:rpt.id,client_id:cid}));
  await sb.from('report_assignments').insert(assigns);

  // Log
  await logEvent('reporte_publicado',rpt.id,rpt.report_no,{clientCount:assigns.length});

  showToast(`Reporte ${rpt.report_no} publicado correctamente.`,'ok');
  setTab('reports');
};

window.toggleClient_active=async function(id,active){

            <td style="font-size:11px">${l.user_name||'—'}</td>

            <td style="font-family:monospace;font-size:11px">${l.report_no||'—'}</td>
            <td style="font-size:10px;color:var(--text3)">${l.metadata?.downloadId?`ID: ${l.metadata.downloadId}`:''}</td>

        }).join('')}
      </tbody>
    </table>

}

window.exportAuditCSV=function(){
  const rows=document.querySelectorAll('#main-content .tbl tbody tr');
  let csv='Fecha,Evento,Usuario,Empresa,Informe,Detalles\n';
  rows.forEach(tr=>{
    const cols=[...tr.querySelectorAll('td')].map(td=>'"'+td.textContent.trim().replace(/"/g,'""')+'"');
    csv+=cols.join(',')+'\n';
  });
  const b=new Blob([csv],{type:'text/csv'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='audit_log.csv';a.click();URL.revokeObjectURL(u);
};

/* ============================================================
   AUTH STATE LISTENER
   ============================================================ */
async function init() {
  if(!IS_CONFIGURED) { render(); return; }

  sb.auth.onAuthStateChange(async (event, session) => {
    if (session?.user) {
      state.user = session.user;
      // Load profile
      const {data:profile} = await sb.from('profiles').select('*').eq('id',session.user.id).single();
      state.profile = profile;
      if(event==='SIGNED_IN') await logEvent('login');
      render();
    } else {
      state.user = null;
      state.profile = null;
      render();
    }
  });

  // Check existing session
  const {data:{session}} = await sb.auth.getSession();
  if(!session) render();
}

init();
</script>
