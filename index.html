<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin">
<title>Portal DS-1 — GM Robótica</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* GM Robótica — Negro industrial + Naranja */
:root{
  --bg:#111111;--bg2:#1a1a1a;--bg3:#222222;
  --border:#2d2d2d;--border2:#3a3a3a;
  --text:#f0f0f0;--text2:#a0a0a0;--text3:#666666;
  --orange:#f97316;--orange2:#ea580c;--orange-bg:rgba(249,115,22,.12);--orange-text:#fb923c;
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,.12);--blue-text:#60a5fa;
  --green:#22c55e;--green-bg:rgba(34,197,94,.12);--green-text:#4ade80;
  --red:#ef4444;--red-bg:rgba(239,68,68,.12);--red-text:#f87171;
  --amber:#f59e0b;--amber-bg:rgba(245,158,11,.12);--amber-text:#fbbf24;
  --purple:#a855f7;--purple-bg:rgba(168,85,247,.12);--purple-text:#c084fc;
  --radius:6px;--shadow:0 2px 12px rgba(0,0,0,.5)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',-apple-system,sans-serif;font-size:13px;color:var(--text);background:var(--bg2)}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:var(--orange);text-decoration:none}

/* Layout */
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Sidebar */
.sb-logo{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-logo img{max-height:36px;max-width:140px;object-fit:contain}
.sb-user{padding:10px 14px;border-bottom:1px solid var(--border)}
.sb-user-row{display:flex;align-items:center;gap:8px}
.sb-av{width:30px;height:30px;border-radius:50%;background:var(--orange-bg);border:1px solid var(--orange);color:var(--orange-text);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.sb-ucmp{font-size:10px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.sb-role-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;margin-top:2px;display:inline-block}
.sb-nav{flex:1;overflow-y:auto;padding:6px 0}
.sb-lbl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:8px 14px 3px}
.sb-link{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border-left:3px solid transparent;transition:all .12s;user-select:none}
.sb-link:hover{background:var(--bg2);color:var(--text);border-left-color:var(--border2)}
.sb-link.active{background:rgba(249,115,22,.08);color:var(--orange);border-left-color:var(--orange);font-weight:700}
.sb-link i{font-size:16px;flex-shrink:0}
.sb-link .badge-count{margin-left:auto;background:var(--orange);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;font-weight:700}
.sb-foot{padding:10px 14px;border-top:1px solid var(--border)}

/* Main */
.mhdr{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;gap:10px;min-height:52px;flex-shrink:0}
.mhdr-title{font-size:15px;font-weight:700;color:var(--text)}
.mhdr-sub{font-size:11px;color:var(--text3);margin-top:1px}
.mcontent{flex:1;overflow-y:auto;padding:18px;background:var(--bg2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;font-size:12px;font-weight:600;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;white-space:nowrap;transition:all .12s}
.btn:hover{background:var(--bg2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;border-color:var(--orange)}
.btn-primary:hover{opacity:.9}
.btn-success{background:var(--green-bg);color:var(--green-text);border-color:var(--green)}
.btn-danger{background:var(--red-bg);color:var(--red-text);border-color:var(--red)}
.btn-info{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:2px 8px;font-size:10px}

/* Inputs */
.inp{width:100%;padding:7px 11px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--text);font-family:inherit;font-size:13px;transition:border .12s}
.inp:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 2px rgba(249,115,22,.15)}
.inp::placeholder{color:var(--text3)}
textarea.inp{resize:vertical;min-height:60px;line-height:1.5}
.lbl{display:block;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.form-group{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* Cards */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-num{font-size:26px;font-weight:800;line-height:1}
.stat-lbl{font-size:10px;color:var(--text2);margin-top:4px}
.stat-icon{font-size:20px;margin-bottom:4px;display:block}

/* Alerts */
.alert{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border-radius:var(--radius);font-size:12px;margin-bottom:12px;line-height:1.5}
.alert-ok{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green)}
.alert-err{background:var(--red-bg);color:var(--red-text);border:1px solid var(--red)}
.alert-info{background:var(--blue-bg);color:var(--blue-text);border:1px solid var(--blue)}
.alert-warn{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber)}
.alert i{font-size:16px;flex-shrink:0;margin-top:1px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-pass{background:var(--green-bg);color:var(--green-text)}
.badge-fail{background:var(--red-bg);color:var(--red-text)}
.badge-cond{background:var(--amber-bg);color:var(--amber-text)}
.badge-super{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff}
.badge-cadmin{background:var(--orange-bg);color:var(--orange-text);border:1px solid var(--orange)}
.badge-inspector{background:var(--blue-bg);color:var(--blue-text)}
.badge-supervisor{background:var(--purple-bg);color:var(--purple-text)}
.badge-viewer{background:var(--bg3);color:var(--text2)}
.badge-grey{background:var(--bg3);color:var(--text2)}

/* Table */
.tbl-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl thead{background:var(--bg3)}
.tbl th{padding:9px 12px;text-align:left;font-size:9px;font-weight:700;color:var(--text2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:rgba(249,115,22,.04)}
.tbl-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}

/* Drop zone */
.dropzone{border:2px dashed var(--border2);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;background:var(--bg3);transition:all .2s}
.dropzone:hover,.dropzone.drag{border-color:var(--orange);background:var(--orange-bg)}

/* Image grid */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.img-thumb{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-thumb .img-del{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(239,68,68,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;cursor:pointer;border:none;line-height:1}

/* Login */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 60% 40%,rgba(249,115,22,.07) 0%,#111 60%);padding:20px}
.login-card{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:30px;box-shadow:0 8px 40px rgba(0,0,0,.6)}

/* Password strength */
.pw-strength{height:4px;border-radius:2px;margin-top:4px;transition:all .3s}
.pw-hint{font-size:10px;color:var(--text3);margin-top:3px}

/* Report detail */
.rpt-section{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--bg)}
.rpt-hdr{background:var(--bg3);padding:8px 14px;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.rpt-body{padding:12px 14px}
.rpt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rpt-field label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:700;display:block;margin-bottom:2px}
.rpt-field span{font-size:12px;color:var(--text);font-weight:500}
.cell-pass{color:var(--green-text);font-weight:700}
.cell-fail{color:var(--red-text);font-weight:700}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;box-shadow:0 4px 24px rgba(0,0,0,.5);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;max-width:360px;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-color:var(--green);color:var(--green-text);background:var(--bg)}
.toast.err{border-color:var(--red);color:var(--red-text);background:var(--bg)}
.toast.info{border-color:var(--orange);color:var(--orange-text);background:var(--bg)}

/* Config */
.cfg-warning{max-width:560px;margin:60px auto;padding:28px;background:var(--bg);border:2px solid var(--amber);border-radius:10px;text-align:center}

/* Mobile */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:6px 0 10px;z-index:200;justify-content:space-around}
.mob-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:700;color:var(--text3);cursor:pointer;padding:4px 10px;text-transform:uppercase}
.mob-item i{font-size:22px}
.mob-item.active{color:var(--orange)}

/* Tabs */
.tab-bar{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab-item{padding:8px 16px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab-item:hover{color:var(--text)}
.tab-item.active{color:var(--orange);border-bottom-color:var(--orange)}

/* Role descriptions */
.role-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.role-card:hover,.role-card.selected{border-color:var(--orange);background:var(--orange-bg)}
.role-card.selected .role-check{display:flex}
.role-check{display:none;width:16px;height:16px;border-radius:50%;background:var(--orange);color:#fff;font-size:10px;align-items:center;justify-content:center;flex-shrink:0}

/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty i{font-size:34px;display:block;margin-bottom:10px}

@media(max-width:768px){
  .sidebar{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .rpt-grid{grid-template-columns:1fr 1fr}
  .mob-nav{display:flex}
  .mcontent{padding:12px;padding-bottom:80px}
  .tbl-wrap{overflow-x:auto}
}
@media print{
  .sidebar,.mhdr,.mob-nav,.btn,.no-print{display:none!important}
  .layout,.main{display:block;height:auto;overflow:visible}
  .mcontent{overflow:visible;padding:0}
  @page{margin:1.5cm}
}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="app"></div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- pdf-lib para marca de agua -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
/* ============================================================
   ⚙️  CONFIGURACIÓN — COMPLETAR CON TUS DATOS DE SUPABASE
   ============================================================ */
const SUPABASE_URL  = 'https://ysuwpuaucfvnqlfnczlu.supabase.co';
const SUPABASE_ANON = 'sb_publishable_CxmuobEx8KuXI5hbD8dfog_XP19xUW-';
const COMPANY_NAME  = 'GM Robótica';
const LOGO_URL      = 'https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=300,fit=crop/d95gEJ0jJgfxbzwe/recurso-1-2x-1yBLDy8iVJ2EB3go.png';
/* ============================================================ */

const IS_OK = !SUPABASE_URL.includes('TU_PROYECTO');
const sb = IS_OK ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: true, autoRefreshToken: true }
}) : null;

/* ── State ── */
let S = { user:null, profile:null, company:null, tab:'dashboard', sub:'', selected:null, toast:null };

/* ── Helpers ── */
const $ = id => document.getElementById(id);
const fmtDate = d => { try{return new Date(d).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return d||'—'} };
const fmtDT = d => { try{return new Date(d).toLocaleString('es-AR')}catch(e){return d||'—'} };
const initials = n => (n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const isSuper  = () => S.profile?.role === 'super_admin';
const isCAdmin = () => ['super_admin','company_admin'].includes(S.profile?.role);
const isInspector = () => ['super_admin','company_admin','inspector'].includes(S.profile?.role);
const canApprove = () => ['super_admin','company_admin','supervisor'].includes(S.profile?.role);

const ROLES = {
  super_admin:   { label:'Super Admin',    cls:'badge-super',      desc:'Acceso total al sistema. Solo GM Robótica.' },
  company_admin: { label:'Admin Empresa',  cls:'badge-cadmin',     desc:'Gestiona usuarios y reportes de su empresa.' },
  inspector:     { label:'Inspector DS-1', cls:'badge-inspector',  desc:'Crea y sube reportes de inspección.' },
  supervisor:    { label:'Supervisor',     cls:'badge-supervisor', desc:'Revisa y aprueba reportes de su empresa.' },
  viewer:        { label:'Visor',          cls:'badge-viewer',     desc:'Solo puede ver y descargar reportes asignados.' },
};

const resultBadge = r => {
  const cls = r==='APROBADO'?'badge-pass':r==='RECHAZADO'?'badge-fail':'badge-cond';
  const icon = r==='APROBADO'?'ti-circle-check':r==='RECHAZADO'?'ti-circle-x':'ti-alert-triangle';
  return `<span class="badge ${cls}"><i class="ti ${icon}"></i>${r||'—'}</span>`;
};
const roleBadge = r => `<span class="badge ${ROLES[r]?.cls||'badge-grey'}">${ROLES[r]?.label||r}</span>`;

const VIS_LABELS = {pinThread:'Roscas Pin',boxThread:'Roscas Caja',pinSeal:'Sello Pin',boxSeal:'Sello Caja',pinNeck:'Cuello Pin',boxExt:'Ext Caja',bodyExt:'Cuerpo',hb:'Hardbanding',bb:'Boreback',slipG:'Ranura Slip',elevG:'Ranura Elevator',marks:'Marcado',dye:'Liq. Penetrantes',mpi:'MPI'};
const MEAS_LABELS = {bodyOD:'OD Cuerpo',bodyID:'ID Cuerpo',wallThk:'Esp. Pared',totalLen:'Longitud',bow:'Curvatura',pinTong:'Tong Space Pin',pinLen:'Long. Pin',bevel:'Bisel Pin',boxTong:'Tong Space Caja',boxOD:'OD Caja',cbDiam:'Ø Counterbore',cbDepth:'Prof. Counterbore',sealShldr:'Ancho Sello'};

function avg3(m){const v=[m?.m1,m?.m2,m?.m3].filter(x=>x!=null&&x!==''&&!isNaN(parseFloat(x))).map(parseFloat);if(!v.length)return '';return(v.reduce((a,b)=>a+b,0)/v.length).toFixed(3);}
function evalSt(v,mn,mx){if(v==null||v==='')return'e';const n=parseFloat(v);if(isNaN(n))return'e';const hm=mn!=null&&mn!==''&&!isNaN(parseFloat(mn));const hM=mx!=null&&mx!==''&&!isNaN(parseFloat(mx));if(hm&&n<parseFloat(mn))return'f';if(hM&&n>parseFloat(mx))return'f';return(hm||hM)?'p':'e';}

function showToast(msg,type='ok'){
  const t=$('toast');
  t.className=`toast ${type}`;
  t.innerHTML=`<i class="ti ti-${type==='ok'?'circle-check':type==='err'?'alert-circle':'bell'}"></i><span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(S.toast);
  S.toast=setTimeout(()=>t.classList.remove('show'),5000);
}

/* ── Audit Log ── */
async function logEvent(event,reportId=null,reportNo=null,meta={}){
  if(!sb||!S.profile)return;
  try{
    await sb.from('audit_logs').insert({
      event,user_id:S.user.id,user_name:S.profile.full_name,
      user_company:S.company?.name||S.profile.company_id,
      user_role:S.profile.role,
      report_id:reportId,report_no:reportNo,
      company_id:S.profile.company_id,
      metadata:meta,
    });
  }catch(e){console.warn('audit',e);}
}

/* ── PDF con marca de agua ── */
async function downloadPDF(report){
  showToast('Generando PDF con marca de agua...','info');
  try{
    const {PDFDocument,rgb,StandardFonts,degrees}=window.PDFLib;
    const pdfDoc=await generateReportPDF(report);
    const fontB=await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const fontL=await pdfDoc.embedFont(StandardFonts.Helvetica);
    const now=new Date();
    const dlId=Math.random().toString(36).slice(2,10).toUpperCase();

    pdfDoc.getPages().forEach(page=>{
      const {width,height}=page.getSize();
      // Marca diagonal
      page.drawText(S.company?.name||S.profile.full_name||'CONFIDENCIAL',{
        x:width/2-180,y:height/2,size:48,font:fontB,
        color:rgb(0.97,0.45,0.09),opacity:.05,rotate:degrees(42)
      });
      // Barra inferior
      page.drawRectangle({x:0,y:0,width,height:24,color:rgb(0.07,0.07,0.07)});
      page.drawText(`DESCARGADO POR: ${S.profile.full_name} — ${S.company?.name||''}`,
        {x:8,y:14,size:6.5,font:fontB,color:rgb(0.97,0.45,0.09)});
      page.drawText(`Fecha: ${now.toLocaleString('es-AR')} | ID descarga: ${dlId} | CONFIDENCIAL`,
        {x:8,y:5,size:5.5,font:fontL,color:rgb(0.6,0.6,0.6)});
    });

    const bytes=await pdfDoc.save();
    const blob=new Blob([bytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`DS1_${report.report_no||'informe'}_${dlId}.pdf`;
    a.click();URL.revokeObjectURL(url);
    await logEvent('descarga_pdf',report.id,report.report_no,{downloadId:dlId});
    showToast(`PDF descargado — ID: ${dlId}`,'ok');
  }catch(err){showToast('Error: '+err.message,'err');}
}

async function generateReportPDF(r){
  const {PDFDocument,rgb,StandardFonts}=window.PDFLib;
  const doc=await PDFDocument.create();
  const fB=await doc.embedFont(StandardFonts.HelveticaBold);
  const fN=await doc.embedFont(StandardFonts.Helvetica);
  const p=doc.addPage([595,842]);
  const{width,height}=p.getSize();
  const m=38,W=width-m*2;let y=height-m;

  // Header
  p.drawRectangle({x:0,y:height-44,width,height:44,color:rgb(0.07,0.07,0.07)});
  p.drawRectangle({x:0,y:height-48,width,height:4,color:rgb(0.97,0.45,0.09)});
  p.drawText('REPORTE DE INSPECCIÓN DS-1 — Vol 3 y Addendum',{x:m,y:height-24,size:9,font:fB,color:rgb(0.97,0.45,0.09)});
  p.drawText(`${r.report_no||'—'}  |  ${fmtDate(r.date)}  |  Cat. ${r.category}`,{x:width-m,y:height-24,size:8,font:fN,color:rgb(0.7,0.7,0.7),xSkewAngle:0,ySkewAngle:0,maxWidth:200,x:width-180-m+m,y:height-24});
  y=height-60;

  const sec=(title)=>{p.drawRectangle({x:m,y:y-2,width:W,height:14,color:rgb(0.13,0.13,0.13)});p.drawText(title,{x:m+4,y:y+2,size:8,font:fB,color:rgb(0.97,0.45,0.09)});y-=20;};
  const fld=(lbl,val,x2=m+48)=>{if(y<50)return;p.drawText(lbl+':',{x:m+2,y:y+1,size:6.5,font:fB,color:rgb(0.5,0.5,0.5)});p.drawText(String(val||'—'),{x:x2,y:y+1,size:8,font:fN,color:rgb(0.9,0.9,0.9)});y-=13;};
  const row3=(pairs)=>{if(y<50)return;const cw=(W-6)/3;pairs.forEach(([l,v],i)=>{const x=m+i*(cw+3);p.drawText(l+':',{x,y:y+1,size:6,font:fB,color:rgb(0.5,0.5,0.5)});p.drawText(String(v||'—'),{x,y:y-8,size:7.5,font:fN,color:rgb(0.9,0.9,0.9)});});y-=22;};

  sec('IDENTIFICACIÓN DEL COMPONENTE');
  fld('Componente',r.component);
  row3([['Empresa',r.client_company_name||''],['Equipo / Rig',r.rig||''],['Pozo',r.well||'']]);
  row3([['Inspector',r.inspector||''],['Cert. DS-1',r.cert_no||''],['Categoría','Cat. '+(r.category||'3')]]);
  row3([['N° Serie',r.serial_no||''],['N° Calor',r.heat_no||''],['Fabricante',r.manufacturer||'']]);
  row3([['Conexión Sup.',r.conn_top||''],['Conexión Inf.',r.conn_bot||''],['OD Nominal',(r.nom_od||'')+(r.nom_od?'"':'')]]);
  y-=4;

  // Visual
  const vis=r.visual_inspection||{};
  const visFails=Object.entries(vis).filter(([,v])=>v==='F').map(([k])=>VIS_LABELS[k]||k);
  const visOk=Object.entries(vis).filter(([,v])=>v==='P').length;
  sec('INSPECCIÓN VISUAL — DS-1 Vol 3 §3.6 y Addendum');
  if(visFails.length===0){p.drawText('✓ TODOS LOS ÍTEMS VISUALES APROBADOS ('+visOk+' ítems)',{x:m+4,y,size:8,font:fB,color:rgb(0.13,0.77,0.37)});y-=14;}
  else{p.drawText('✗ ÍTEMS RECHAZADOS: '+visFails.join(', '),{x:m+4,y,size:7.5,font:fB,color:rgb(0.94,0.27,0.27)});y-=14;}
  y-=6;

  // Measurements
  const meas=r.measurements||{};
  const measPairs=Object.entries(MEAS_LABELS).filter(([k])=>meas[k]&&(meas[k].m1||meas[k].m2||meas[k].m3));
  if(measPairs.length){
    sec('MEDICIONES DIMENSIONALES — Tablas DS-1 Vol 3');
    const cols=[m,m+88,m+130,m+175,m+225,m+270,m+315,m+362,m+405];
    p.drawRectangle({x:m,y:y-2,width:W,height:12,color:rgb(0.18,0.18,0.18)});
    ['Parámetro','Un','Mín','Máx','Med 1','Med 2','Med 3','Prom.','Est.'].forEach((h,i)=>p.drawText(h,{x:cols[i]+2,y:y+1,size:6,font:fB,color:rgb(0.6,0.6,0.6)}));
    y-=12;
    measPairs.forEach(([k,label])=>{
      if(y<50)return;
      const mm=meas[k];const a=avg3(mm);const st=evalSt(a||mm.m1,mm.min,mm.max);
      const rc=st==='f'?rgb(0.94,0.27,0.27):st==='p'?rgb(0.13,0.77,0.37):rgb(0.6,0.6,0.6);
      p.drawRectangle({x:m,y:y-1,width:W,height:10,color:rgb(0.1,0.1,0.1),opacity:0.5});
      p.drawText(label.slice(0,20),{x:cols[0]+2,y:y+1,size:6,font:fN,color:rgb(0.85,0.85,0.85)});
      p.drawText('in',{x:cols[1]+2,y:y+1,size:5.5,font:fN,color:rgb(0.5,0.5,0.5)});
      p.drawText(mm.min||'',{x:cols[2]+2,y:y+1,size:6,font:fN,color:rgb(0.5,0.7,1)});
      p.drawText(mm.max||'',{x:cols[3]+2,y:y+1,size:6,font:fN,color:rgb(0.5,0.7,1)});
      [mm.m1,mm.m2,mm.m3].forEach((v,i)=>p.drawText(v||'—',{x:cols[4+i]+2,y:y+1,size:6,font:fN,color:rgb(0.85,0.85,0.85)}));
      if(a)p.drawText(a,{x:cols[7]+2,y:y+1,size:6,font:fB,color:rc});
      if(st!=='e')p.drawText(st==='p'?'✓ OK':'✗ Falla',{x:cols[8]+2,y:y+1,size:5.5,font:fB,color:rc});
      y-=10;
    });
    y-=6;
  }

  // Images embedded
  const images=r.images||[];
  if(images.length>0&&y>150){
    sec('EVIDENCIA FOTOGRÁFICA');
    p.drawText(`${images.length} imagen(es) adjunta(s). Ver versión digital del informe.`,{x:m+4,y,size:7.5,font:fN,color:rgb(0.6,0.6,0.6)});
    y-=14;
  }

  // Comments
  if(r.comments&&y>80){sec('OBSERVACIONES');const lines=r.comments.match(/.{1,110}/g)||[r.comments];lines.slice(0,3).forEach(l=>{if(y<50)return;p.drawText(l,{x:m+4,y,size:7.5,font:fN,color:rgb(0.85,0.85,0.85)});y-=11;});y-=4;}

  // Result
  const rc=r.result==='APROBADO'?rgb(0.08,0.62,0.24):r.result==='RECHAZADO'?rgb(0.86,0.15,0.15):rgb(0.6,0.27,0.04);
  y=Math.min(y,120);
  p.drawRectangle({x:m,y:y-20,width:W,height:28,color:rgb(0.07,0.07,0.07),borderColor:rc[0]?rc:rgb(0.3,0.3,0.3),borderWidth:1});
  p.drawRectangle({x:m,y:y+6,width:4,height:22,color:rc});
  p.drawText(`RESULTADO: ${r.result||'—'}`,{x:m+12,y:y-8,size:13,font:fB,color:rc});
  p.drawText(`Inspector: ${r.inspector||'—'} | Cert: ${r.cert_no||'—'} | ${fmtDate(r.date)}`,{x:width-m,y:y-8,size:7,font:fN,color:rgb(0.5,0.5,0.5),x:m+12,y:y-22,});
  y-=40;

  // Signatures
  [['Inspector / Firma',''],['Supervisor / Conformidad',''],['Cliente / Recepción','']].forEach(([l],i)=>{
    const x=m+i*(W/3+2);
    p.drawLine({start:{x,y:30},end:{x:x+W/3-8,y:30},thickness:.5,color:rgb(0.3,0.3,0.3)});
    p.drawText(l,{x,y:20,size:6,font:fN,color:rgb(0.5,0.5,0.5)});
    p.drawText('Fecha: ____________',{x,y:11,size:6,font:fN,color:rgb(0.4,0.4,0.4)});
  });

  return doc;
}

/* ── Change Password ── */
function renderChangePassword(app){
  app.innerHTML=`
  <div class="login-page">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:20px">
        <img src="${LOGO_URL}" style="max-height:50px;margin-bottom:12px" alt="Logo">
        <h2 style="color:var(--orange);font-size:18px">Crear tu contraseña</h2>
        <p style="color:var(--text2);font-size:12px;margin-top:4px">Por seguridad, creá tu contraseña personal antes de continuar.</p>
      </div>
      <div class="alert alert-info"><i class="ti ti-shield-lock"></i>Tu contraseña debe tener al menos 8 caracteres, una mayúscula, un número y un carácter especial.</div>
      <div id="cp-err"></div>
      <div class="form-group">
        <label class="lbl">Nueva contraseña</label>
        <input class="inp" type="password" id="cp-pass1" placeholder="Mínimo 8 caracteres" oninput="checkPwStrength(this.value)">
        <div class="pw-strength" id="pw-bar" style="background:var(--border2)"></div>
        <div class="pw-hint" id="pw-hint">Ingresá tu nueva contraseña</div>
      </div>
      <div class="form-group">
        <label class="lbl">Confirmar contraseña</label>
        <input class="inp" type="password" id="cp-pass2" placeholder="Repetí la contraseña" onkeydown="if(event.key==='Enter')doChangePassword()">
      </div>
      <button class="btn btn-primary" style="width:100%;padding:10px;justify-content:center;font-size:14px" onclick="doChangePassword()">
        <i class="ti ti-lock-check"></i> Guardar contraseña y continuar
      </button>
    </div>
  </div>`;
}

function checkPwStrength(pw){
  const bar=$('pw-bar');const hint=$('pw-hint');if(!bar)return;
  let score=0;
  if(pw.length>=8)score++;if(/[A-Z]/.test(pw))score++;if(/[0-9]/.test(pw))score++;if(/[^a-zA-Z0-9]/.test(pw))score++;if(pw.length>=12)score++;
  const colors=['#ef4444','#f97316','#eab308','#22c55e','#16a34a'];
  const msgs=['Muy débil','Débil','Regular','Fuerte','Muy fuerte'];
  bar.style.background=colors[score-1]||'var(--border2)';
  bar.style.width=(score*20)+'%';
  hint.textContent=msgs[score-1]||'Ingresá tu nueva contraseña';
  hint.style.color=colors[score-1]||'var(--text3)';
}

async function doChangePassword(){
  const p1=$('cp-pass1').value;const p2=$('cp-pass2').value;
  if(p1.length<8){$('cp-err').innerHTML='<div class="alert alert-err"><i class="ti ti-alert-circle"></i>Mínimo 8 caracteres.</div>';return;}
  if(!/[A-Z]/.test(p1)){$('cp-err').innerHTML='<div class="alert alert-err"><i class="ti ti-alert-circle"></i>Necesita al menos una mayúscula.</div>';return;}
  if(!/[0-9]/.test(p1)){$('cp-err').innerHTML='<div class="alert alert-err"><i class="ti ti-alert-circle"></i>Necesita al menos un número.</div>';return;}
  if(!/[^a-zA-Z0-9]/.test(p1)){$('cp-err').innerHTML='<div class="alert alert-err"><i class="ti ti-alert-circle"></i>Necesita al menos un carácter especial (!, @, #, etc.)</div>';return;}
  if(p1!==p2){$('cp-err').innerHTML='<div class="alert alert-err"><i class="ti ti-alert-circle"></i>Las contraseñas no coinciden.</div>';return;}
  const{error}=await sb.auth.updateUser({password:p1});
  if(error){$('cp-err').innerHTML=`<div class="alert alert-err"><i class="ti ti-alert-circle"></i>${error.message}</div>`;return;}
  await sb.from('profiles').update({must_change_password:false}).eq('id',S.user.id);
  S.profile.must_change_password=false;
  await logEvent('cambio_contrasena');
  showToast('¡Contraseña actualizada! Bienvenido al portal.','ok');
  render();
}

      </div>

}

async function showForgot(){
  const email=prompt('Ingresá tu email para recuperar la contraseña:');
  if(!email)return;
  const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});
  if(error)showToast(error.message,'err');
  else showToast('Se envió un email para restablecer tu contraseña.','ok');
}

async function doLogin(){
  const email=$('l-email')?.value?.trim();
  const pass=$('l-pass')?.value;
  if(!email||!pass)return;
  $('login-err').innerHTML='';
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){
    $('login-err').innerHTML=`<div class="alert alert-err"><i class="ti ti-alert-circle"></i>${error.message==='Invalid login credentials'?'Email o contraseña incorrectos.':error.message}</div>`;
    return;
  }
  await logEvent('login');
}

async function loadTab(){

function filterTbl(){

    const ok=(!q||tr.dataset.text?.includes(q))&&(!r||tr.dataset.result===r);

}

window.addImages=function(files){
  Array.from(files).forEach(file=>{
    if(file.size>10*1024*1024){showToast(`${file.name} supera 10MB`,'err');return;}
    const url=URL.createObjectURL(file);
    window._imgs.push({file,url});
    const grid=$('img-preview');
    const div=document.createElement('div');div.className='img-thumb';
    div.innerHTML=`<img src="${url}"><button class="img-del" onclick="removeImg(${window._imgs.length-1},this.closest('.img-thumb'))">×</button>`;
    grid.appendChild(div);
  });
};
window.removeImg=function(i,el){window._imgs[i]=null;el.remove();};

window.loadJsonFile=function(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      window._parsed=d;
      const ri=d.reportInfo||d||{};const co=d.component||{};
      const set=(id,v)=>{if($(id)&&v!=null)$(id).value=v;};
      set('u-rno',ri.reportNo);set('u-date',ri.date);set('u-cat',ri.category||'3');
      set('u-result',d.result||'APROBADO');
      set('u-comp',co.description||co.type||(ri.topConnType&&ri.botConnType?`${ri.topConnType} Pin × ${ri.botConnType} Caja`:''));
      set('u-cname',ri.client||ri.company||'');set('u-rig',ri.rig||'');set('u-well',ri.well||'');
      set('u-insp',ri.inspector||'');set('u-cert',ri.certNo||'');set('u-sn',co.serialNo||'');
      set('u-obs',d.comments||'');
      $('upload-form').style.display='block';
      $('parse-msg').innerHTML='';
    }catch(ex){$('parse-msg').innerHTML=`<div class="alert alert-err"><i class="ti ti-alert-circle"></i>JSON inválido: ${ex.message}</div>`;}
  };
  r.readAsText(file);
};

window.submitReport=async function(){
  const err=$('upload-err');
  const rno=$('u-rno')?.value?.trim();
  if(!rno){err.innerHTML='<div class="alert alert-err"><i class="ti ti-alert-circle"></i>El N° de Reporte es obligatorio.</div>';return;}

  // Subir imágenes a Supabase Storage
  const imgUrls=[];
  const validImgs=(window._imgs||[]).filter(Boolean);
  for(const img of validImgs){
    try{
      const ext=img.file.name.split('.').pop();
      const path=`${S.user.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const{data,error}=await sb.storage.from('report-images').upload(path,img.file,{contentType:img.file.type});
      if(error)throw error;
      const{data:{publicUrl}}=sb.storage.from('report-images').getPublicUrl(path);
      imgUrls.push(publicUrl);
    }catch(e){showToast('Error subiendo imagen: '+e.message,'err');}
  }

  const d=window._parsed||{};const ri=d.reportInfo||{};const co=d.component||{};
  const companyId=$('u-company-id')?.value||S.profile.company_id;

  const rptData={
    report_no:rno,date:$('u-date')?.value||null,revision:ri.revision||'0',
    component:$('u-comp')?.value||'',type:co.type||'Sustituto',
    serial_no:$('u-sn')?.value||'',heat_no:co.heatNo||'',
    manufacturer:co.manufacturer||'',material:co.material||'',
    grade:co.grade||'',nom_od:co.nomOD||'',nom_id:co.nomID||'',
    comp_length:co.length||co.compLength||'',weight:co.weight||'',
    makeup_torque:co.makeupTorque||'',
    conn_top:(ri.topConnType||'')+(ri.topConnConfig?' '+ri.topConnConfig:''),
    conn_bot:(ri.botConnType||'')+(ri.botConnConfig?' '+ri.botConnConfig:''),
    company_id:companyId||null,
    client_company_name:$('u-cname')?.value||'',
    rig:$('u-rig')?.value||'',well:$('u-well')?.value||'',
    inspector:$('u-insp')?.value||'',cert_no:$('u-cert')?.value||'',
    category:$('u-cat')?.value||'3',result:$('u-result')?.value||'APROBADO',
    comments:$('u-obs')?.value||'',
    visual_inspection:d.visualInspection||{},measurements:d.measurements||{},
    images:imgUrls,raw_data:d,uploaded_by:S.user.id,published:true,
  };

  const{data:rpt,error}=await sb.from('reports').insert(rptData).select().single();
  if(error){err.innerHTML=`<div class="alert alert-err"><i class="ti ti-alert-circle"></i>${error.message}</div>`;return;}

  await logEvent('reporte_publicado',rpt.id,rpt.report_no,{images:imgUrls.length});
  showToast(`Reporte ${rpt.report_no} publicado.${imgUrls.length?' '+imgUrls.length+' imagen(es) adjunta(s).':''}`,'ok');
  setTab('reports');
};

            <select class="inp" style="width:130px;font-size:11px" onchange="changeRole('${u.id}',this.value)">

              <i class="ti ti-${u.active?'user-x':'user-check'}"></i>
            </button>
          </div>
        </td>
      </tr>`).join('')}
      </tbody>
    </table>

}

window.changeRole=async(id,role)=>{
  const{error}=await sb.from('profiles').update({role}).eq('id',id);
  if(error)showToast(error.message,'err');
  else showToast('Rol actualizado.','ok');
};
window.toggleUser=async(id,active)=>{
  await sb.from('profiles').update({active}).eq('id',id);
  showToast(active?'Usuario activado.':'Usuario desactivado.','ok');
  renderUsers();
};

window.selectRole=function(role,el){
  document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  $('inv-role').value=role;
};

window.sendInvitation=async function(){
  const name=$('inv-name')?.value?.trim();
  const email=$('inv-email')?.value?.trim();
  const role=$('inv-role')?.value||'viewer';
  const coId=$('inv-co')?.value||S.profile.company_id;

  $('inv-err').innerHTML='';$('inv-ok').innerHTML='';
  if(!name||!email){$('inv-err').innerHTML='<div class="alert alert-err"><i class="ti ti-alert-circle"></i>Nombre y email son obligatorios.</div>';return;}
  if(!coId){$('inv-err').innerHTML='<div class="alert alert-err"><i class="ti ti-alert-circle"></i>Seleccioná una empresa.</div>';return;}

  // Crear invitación en DB
  const{data:inv,error}=await sb.from('invitations').insert({
    email,full_name:name,company_id:coId,role,invited_by:S.user.id
  }).select().single();

  if(error){$('inv-err').innerHTML=`<div class="alert alert-err"><i class="ti ti-alert-circle"></i>${error.message}</div>`;return;}

  // Enviar invitación via Supabase Auth
  const{error:authErr}=await sb.auth.signInWithOtp({email,options:{
    emailRedirectTo:window.location.href,
    data:{full_name:name,company:coId,role}
  }});

  const link=`${window.location.href}?invite=${inv.token}`;
  $('inv-ok').innerHTML=`
    <div class="alert alert-ok"><i class="ti ti-circle-check"></i>
      <div><strong>Invitación creada para ${name}.</strong>
      <div style="margin-top:6px;font-size:11px">
        ${authErr?'El email mágico no se pudo enviar. Enviá este link manualmente:':' Se envió un email de acceso a '+email+'. También podés compartir este link:'}
        <br><code style="background:var(--bg3);padding:2px 6px;border-radius:3px;font-size:10px;word-break:break-all">${link}</code>
        <button onclick="navigator.clipboard.writeText('${link}').then(()=>showToast('Link copiado','ok'))" class="btn btn-xs" style="margin-left:6px"><i class="ti ti-copy"></i></button>
      </div></div>
    </div>`;

  await logEvent('invitacion_enviada',null,null,{email,role,company:coId});
};

window.exportCSV=function(){
  const rows=document.querySelectorAll('#mc .tbl tbody tr');
  let csv='Fecha,Evento,Usuario,Rol,Empresa,Informe\n';
  rows.forEach(tr=>{
    const cols=[...tr.querySelectorAll('td')].map(td=>'"'+td.textContent.trim().replace(/"/g,'""')+'"');
    csv+=cols.join(',')+'\n';
  });
  const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=`audit_log_${new Date().toISOString().slice(0,10)}.csv`;a.click();
};

/* ============================================================
   AUTH STATE
   ============================================================ */
async function init(){
  if(!IS_OK){render();return;}

  sb.auth.onAuthStateChange(async(event,session)=>{
    if(session?.user){
      S.user=session.user;
      const{data:profile}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
      S.profile=profile;
      if(profile?.company_id){
        const{data:co}=await sb.from('companies').select('*').eq('id',profile.company_id).single();
        S.company=co;
      }
      if(event==='SIGNED_IN'){
        await sb.from('profiles').update({last_login:new Date().toISOString()}).eq('id',session.user.id);
        await logEvent('login');
      }
     
    }else{
      S={user:null,profile:null,company:null,tab:'dashboard',sub:'',selected:null};
      render();
    }
  });

 try{const r=await Promise.race([sb.auth.getSession(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),5000))]);if(!r?.data?.session)render();}catch(e){render();}
}

init();
</script>
try{
  const{data:{session},error}=await sb.auth.getSession();
  if(error)throw error;
  render();
}catch(e){
  console.error('Supabase error:',e);
  render();
}
